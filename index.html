<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f0d0b" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f0d0b'/%3E%3Cpath d='M16 6c2.7 3.2 4.1 5.5 4.1 7.7a4.1 4.1 0 0 1-8.2 0C11.9 11.5 13.3 9.2 16 6z' fill='%23d8a750'/%3E%3Crect x='11' y='17.5' width='10' height='8.5' rx='2' fill='%23ece4d9'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="소곤마켓. 새벽 3시 33분에만 배송되는 생활용품 가게에서 벌어지는 일을 다루는 인터랙티브 추리 게임."
    />
    <title>소곤마켓 — 새벽 배송</title>
    <style>
/* 소곤마켓 — 디자인 토큰. 색은 모두 여기서만 정의한다. */
:root {
  /* 표면 */
  --bg: #0f0d0b;
  --bg-2: #14110e;
  --bg-card: #1b1713;
  --bg-card-2: #221d18;
  --bg-paper: #e8dfd0;
  --line: #332b24;
  --line-soft: #2a231d;

  /* 글자 */
  --fg: #ece4d9;
  --fg-2: #c9bdae;
  --fg-3: #a2957f;
  --fg-inverse: #171206;
  --fg-paper: #241f19;

  /* 강조 */
  --brand: #d8a750;
  --brand-dim: #a97f39;
  --brand-soft: #4a3a22;
  --danger: #d97a63;
  --danger-soft: #3a231d;
  --ok: #8fae86;

  /* 모서리 */
  --r-sm: 2px;
  --r-md: 8px;
  --r-lg: 14px;
  --r-pill: 999px;

  /* 여백 */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --sp-7: 40px;

  /* 글자 크기 7단계 */
  --t-1: 12px;
  --t-2: 13px;
  --t-3: 15px;
  --t-4: 16px;
  --t-5: 19px;
  --t-6: 24px;
  --t-7: 34px;

  /* 안전 영역 */
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);

  --shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
  --ease: cubic-bezier(0.2, 0, 0, 1);
}

/* 밤이 깊어질수록 배경이 조금씩 가라앉는다. 대비는 그대로 유지한다. */
html.mood-1 {
  --bg: #100e0c;
  --bg-2: #151210;
  --bg-card: #1d1915;
  --bg-card-2: #241f1a;
}

html.mood-2 {
  --bg: #0a0908;
  --bg-2: #0f0d0b;
  --bg-card: #161310;
  --bg-card-2: #1c1814;
}

/* 소곤마켓 — 화면 스타일. 색은 tokens.css의 변수만 쓴다. */

*,
*::before,
*::after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
}

body {
  transition: background-color 220ms var(--ease);
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  color: var(--fg);
  font-family: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", system-ui, -apple-system,
    "Malgun Gothic", sans-serif;
  font-size: var(--t-4);
  line-height: 1.62;
  letter-spacing: -0.01em;
  overscroll-behavior: none;
  touch-action: manipulation;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 60;
  background-image: linear-gradient(
    to bottom,
    rgba(0, 0, 0, 0) 0%,
    rgba(0, 0, 0, 0.16) 50%,
    rgba(0, 0, 0, 0) 100%
  );
  background-size: 100% 3px;
  opacity: 0.55;
  mix-blend-mode: multiply;
}

::selection {
  background: var(--brand-soft);
  color: var(--fg);
}

::-webkit-scrollbar {
  width: 0;
  height: 0;
  display: none;
}

h1,
h2,
h3,
h4,
p,
ul,
ol,
figure {
  margin: 0;
  padding: 0;
}

ul,
ol {
  list-style: none;
}

a {
  color: inherit;
  text-decoration: none;
  touch-action: manipulation;
}

button {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
  border: 0;
  background: none;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* ── 뼈대 ───────────────────────────────────────────── */

.app {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  max-width: 480px;
  margin: 0 auto;
  padding-bottom: calc(72px + var(--sab));
  position: relative;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: calc(var(--sat) + var(--sp-2)) var(--sp-3) var(--sp-2);
  background: rgba(15, 13, 11, 0.92);
  border-bottom: 1px solid var(--line-soft);
  backdrop-filter: blur(8px);
}

.brand {
  display: flex;
  align-items: baseline;
  gap: var(--sp-2);
  min-height: 44px;
  padding: var(--sp-2) var(--sp-1);
  margin-right: auto;
  -webkit-user-select: none;
  user-select: none;
}

.brand__mark {
  font-size: var(--t-5);
  font-weight: 700;
  letter-spacing: 0.14em;
}

.brand__since {
  font-size: var(--t-1);
  color: var(--fg-3);
  letter-spacing: 0.08em;
}

.clock {
  font-family: ui-monospace, "SFMono-Regular", "D2Coding", monospace;
  font-size: var(--t-3);
  font-variant-numeric: tabular-nums;
  color: var(--brand);
  letter-spacing: 0.06em;
  padding: 6px 8px;
  border: 1px solid var(--brand-soft);
  border-radius: var(--r-sm);
  background: var(--bg-card);
}

.clock.is-late {
  color: var(--danger);
  border-color: var(--danger-soft);
}

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  padding: 0 var(--sp-2);
  color: var(--fg-2);
  border-radius: var(--r-md);
  transition: color 160ms var(--ease), background-color 160ms var(--ease);
}

.icon-btn:active {
  background: var(--bg-card-2);
}

.icon-btn__glyph {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.view {
  flex: 1;
  padding: var(--sp-4) var(--sp-4) var(--sp-6);
  animation: viewIn 200ms var(--ease) both;
}

@keyframes viewIn {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ── 하단 탭 ─────────────────────────────────────────── */

.tabbar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 50;
  display: flex;
  justify-content: center;
  gap: var(--sp-1);
  max-width: 480px;
  margin: 0 auto;
  padding: var(--sp-1) var(--sp-2) calc(var(--sp-1) + var(--sab));
  background: rgba(20, 17, 14, 0.96);
  border-top: 1px solid var(--line);
  backdrop-filter: blur(8px);
}

.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: 56px;
  padding: var(--sp-1);
  font-size: var(--t-1);
  color: var(--fg-3);
  letter-spacing: 0.02em;
  border-radius: var(--r-md);
  transition: color 160ms var(--ease);
}

.tab svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.tab[aria-current="page"] {
  color: var(--brand);
}

.tab.is-alert {
  color: var(--fg);
}

.tab__dot {
  width: 4px;
  height: 4px;
  border-radius: var(--r-pill);
  background: var(--danger);
}

/* ── 공통 ────────────────────────────────────────────── */

.hero {
  position: relative;
  overflow: hidden;
  padding: var(--sp-5) var(--sp-4);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: radial-gradient(120% 90% at 80% 0%, var(--bg-card-2) 0%, var(--bg-2) 62%);
  margin-bottom: var(--sp-5);
}

.hero__kicker {
  font-size: var(--t-1);
  color: var(--brand);
  letter-spacing: 0.18em;
}

.hero__title {
  font-size: var(--t-6);
  white-space: pre-line;
  line-height: 1.3;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: var(--sp-3) 0 var(--sp-2);
}

.hero__body {
  font-size: var(--t-3);
  color: var(--fg-2);
  max-width: 34ch;
}

.hero__meta {
  display: flex;
  gap: var(--sp-3);
  margin-top: var(--sp-4);
  font-family: ui-monospace, "SFMono-Regular", "D2Coding", monospace;
  font-size: var(--t-2);
  color: var(--fg-3);
}

.hero__stamp {
  position: absolute;
  top: var(--sp-4);
  right: var(--sp-4);
  width: 54px;
  height: 54px;
  border: 1px solid var(--danger-soft);
  border-radius: var(--r-pill);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--danger);
  font-size: var(--t-1);
  letter-spacing: 0.06em;
  transform: rotate(-12deg);
  opacity: 0.8;
}

.section {
  margin-bottom: var(--sp-6);
}

.section__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-3);
  margin-bottom: var(--sp-3);
}

.section__title {
  font-size: var(--t-5);
  font-weight: 700;
  letter-spacing: -0.01em;
}

.section__sub {
  font-size: var(--t-2);
  color: var(--fg-3);
}

.link-more {
  font-size: var(--t-2);
  color: var(--brand);
  padding: var(--sp-2) 0;
  min-height: 44px;
  display: inline-flex;
  align-items: center;
}

.chips {
  display: flex;
  gap: var(--sp-2);
  overflow-x: auto;
  padding-bottom: var(--sp-1);
  margin-bottom: var(--sp-4);
  scrollbar-width: none;
}

.chip {
  flex: none;
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  padding: 0 var(--sp-4);
  font-size: var(--t-3);
  color: var(--fg-2);
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--r-pill);
  transition: color 160ms var(--ease), border-color 160ms var(--ease);
}

.chip[aria-pressed="true"] {
  color: var(--fg-inverse);
  background: var(--brand);
  border-color: var(--brand);
  font-weight: 700;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-3);
}

.card {
  display: flex;
  flex-direction: column;
  text-align: left;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  overflow: hidden;
  transition: border-color 180ms var(--ease), transform 180ms var(--ease);
}

.card:active {
  transform: scale(0.99);
  border-color: var(--brand-dim);
}

.thumb {
  position: relative;
  aspect-ratio: 4 / 3;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-card-2);
  border-bottom: 1px solid var(--line-soft);
}

.thumb::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.18);
  pointer-events: none;
}

.thumb svg {
  width: 58%;
  height: 58%;
  fill: none;
  stroke: var(--fg-3);
  stroke-width: 1.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.thumb__code {
  position: absolute;
  left: var(--sp-2);
  bottom: 6px;
  font-family: ui-monospace, "SFMono-Regular", "D2Coding", monospace;
  font-size: var(--t-1);
  color: var(--fg-3);
  letter-spacing: 0.08em;
  z-index: 1;
}

.thumb__flag {
  position: absolute;
  top: var(--sp-2);
  left: var(--sp-2);
  z-index: 1;
  font-size: var(--t-1);
  padding: 2px 6px;
  color: var(--danger);
  background: var(--danger-soft);
  border-radius: var(--r-sm);
  letter-spacing: 0.04em;
}

.card__body {
  padding: var(--sp-3);
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}

.card__name {
  font-size: var(--t-3);
  font-weight: 600;
  line-height: 1.4;
  letter-spacing: -0.01em;
}

.card__meta {
  font-size: var(--t-1);
  color: var(--fg-3);
}

.price {
  font-weight: 700;
  color: var(--fg);
  letter-spacing: -0.01em;
}

.price__unit {
  font-size: var(--t-2);
  color: var(--fg-3);
  font-weight: 400;
  margin-left: 2px;
}

.card .price {
  margin-top: var(--sp-1);
  font-size: var(--t-3);
}

/* ── 목록 행 ─────────────────────────────────────────── */

.rows {
  border-top: 1px solid var(--line-soft);
}

.item-row {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  width: 100%;
  min-height: 56px;
  padding: var(--sp-3) 0;
  text-align: left;
  border-bottom: 1px solid var(--line-soft);
  transition: background-color 160ms var(--ease);
}

.item-row:active {
  background: var(--bg-card);
}

.item-row__main {
  flex: 1;
  min-width: 0;
}

.item-row__title {
  font-size: var(--t-3);
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.item-row__sub {
  font-size: var(--t-2);
  color: var(--fg-3);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.item-row__side {
  flex: none;
  font-size: var(--t-1);
  color: var(--fg-3);
  font-family: ui-monospace, "SFMono-Regular", "D2Coding", monospace;
}

.unread {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: var(--r-pill);
  background: var(--danger);
  margin-right: var(--sp-2);
  vertical-align: middle;
}

/* ── 상세 ────────────────────────────────────────────── */

.page-head {
  margin-bottom: var(--sp-4);
}

.kicker {
  font-size: var(--t-2);
  color: var(--brand);
  letter-spacing: 0.14em;
  margin-bottom: var(--sp-2);
}

.page-title {
  font-size: var(--t-6);
  font-weight: 700;
  line-height: 1.32;
  letter-spacing: -0.02em;
}

.page-sub {
  margin-top: var(--sp-2);
  font-size: var(--t-3);
  color: var(--fg-2);
}

.detail-top {
  display: flex;
  flex-direction: column;
  gap: var(--sp-4);
  margin-bottom: var(--sp-5);
}

.detail-art {
  position: relative;
  aspect-ratio: 4 / 3;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--bg-card-2);
  display: flex;
  align-items: center;
  justify-content: center;
}

.detail-art svg {
  width: 46%;
  height: 46%;
  fill: none;
  stroke: var(--fg-2);
  stroke-width: 1;
}

.detail-art__note {
  position: absolute;
  left: var(--sp-3);
  bottom: var(--sp-3);
  right: var(--sp-3);
  font-size: var(--t-1);
  color: var(--fg-3);
  letter-spacing: 0.02em;
}

.detail-info {
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}

.detail-name {
  font-size: var(--t-5);
  font-weight: 700;
  line-height: 1.35;
}

.detail-price {
  font-size: var(--t-6);
  font-weight: 700;
  letter-spacing: -0.02em;
}

.detail-ship {
  font-size: var(--t-2);
  color: var(--fg-3);
  font-family: ui-monospace, "SFMono-Regular", "D2Coding", monospace;
}

.prose {
  font-size: var(--t-4);
  color: var(--fg-2);
  line-height: 1.76;
}

.prose p + p {
  margin-top: var(--sp-3);
}

.spec {
  border-top: 1px solid var(--line-soft);
  margin-top: var(--sp-4);
}

.spec__row {
  display: flex;
  gap: var(--sp-4);
  padding: var(--sp-2) 0;
  border-bottom: 1px solid var(--line-soft);
  font-size: var(--t-2);
}

.spec__key {
  flex: none;
  width: 88px;
  color: var(--fg-3);
}

.spec__val {
  color: var(--fg-2);
}

.panel {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: var(--sp-4);
  margin-bottom: var(--sp-4);
}

.panel--flat {
  background: transparent;
}

.panel__title {
  font-size: var(--t-3);
  font-weight: 700;
  margin-bottom: var(--sp-2);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
}

.panel__hint {
  font-size: var(--t-2);
  color: var(--fg-3);
  font-weight: 400;
}

.note {
  padding: var(--sp-3);
  border-left: 2px solid var(--brand-dim);
  background: var(--bg-card);
  font-size: var(--t-3);
  color: var(--fg-2);
  border-radius: 0 var(--r-sm) var(--r-sm) 0;
}

.note--danger {
  border-left-color: var(--danger);
  background: var(--danger-soft);
  color: var(--fg);
}

.review {
  padding: var(--sp-3) 0;
  border-bottom: 1px solid var(--line-soft);
}

.review__head {
  display: flex;
  align-items: baseline;
  gap: var(--sp-2);
  margin-bottom: var(--sp-2);
}

.review__user {
  font-size: var(--t-2);
  font-weight: 700;
  color: var(--fg-2);
}

.review__date {
  font-size: var(--t-1);
  color: var(--fg-3);
  font-family: ui-monospace, "SFMono-Regular", "D2Coding", monospace;
}

.review__stars {
  margin-left: auto;
  font-size: var(--t-1);
  color: var(--brand);
  letter-spacing: 0.12em;
}

.review__body {
  font-size: var(--t-3);
  color: var(--fg-2);
  line-height: 1.7;
}

.review__foot {
  margin-top: var(--sp-2);
  font-size: var(--t-1);
  color: var(--fg-3);
}

.qna {
  border: 1px solid var(--line-soft);
  border-radius: var(--r-md);
  padding: var(--sp-3);
  margin-bottom: var(--sp-3);
  background: var(--bg-2);
}

.qna__q,
.qna__a {
  display: flex;
  gap: var(--sp-2);
  font-size: var(--t-3);
  line-height: 1.7;
}

.qna__q {
  color: var(--fg);
}

.qna__a {
  margin-top: var(--sp-3);
  padding-top: var(--sp-3);
  border-top: 1px dashed var(--line);
  color: var(--fg-2);
}

.qna__mark {
  flex: none;
  width: 18px;
  font-weight: 700;
  color: var(--brand);
}

.qna__meta {
  margin-top: var(--sp-2);
  font-size: var(--t-1);
  color: var(--fg-3);

// 소곤마켓 — 소리. 오디오 파일 없이 Web Audio API로만 합성한다.

const MUTE_KEY = "sogon.muted";

function createAudio() {
  let ctx = null;
  let master = null;
  let ambientNodes = null;
  let muted = false;

  try {
    muted = window.localStorage.getItem(MUTE_KEY) === "1";
  } catch (err) {
    muted = false;
  }

  function now() {
    return ctx ? ctx.currentTime : 0;
  }

  function ensure() {
    if (ctx) {
      if (ctx.state === "suspended") ctx.resume();
      return ctx;
    }
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    try {
      ctx = new Ctor();
    } catch (err) {
      return null;
    }
    master = ctx.createGain();
    master.gain.value = muted ? 0 : 0.6;
    master.connect(ctx.destination);
    startAmbient();
    return ctx;
  }

  function gain(value, target) {
    const g = ctx.createGain();
    g.gain.value = value;
    if (target) g.connect(target);
    else g.connect(master);
    return g;
  }

  function tone(freq, start, dur, type, level, target) {
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const g = gain(0.0001, target);
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, start);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, level), start + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    osc.connect(g);
    osc.start(start);
    osc.stop(start + dur + 0.02);
  }

  function noiseBurst(start, dur, level, filterFreq) {
    if (!ctx) return;
    const frames = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buffer = ctx.createBuffer(1, frames, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < frames; i += 1) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / frames);
    }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = filterFreq || 900;
    filter.Q.value = 0.8;
    const g = gain(0.0001);
    g.gain.setValueAtTime(Math.max(0.0002, level), start);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    src.connect(filter);
    filter.connect(g);
    src.start(start);
    src.stop(start + dur + 0.02);
  }

  function startAmbient() {
    if (!ctx || ambientNodes) return;
    const drone = ctx.createGain();
    drone.gain.value = 0.0001;
    drone.connect(master);
    drone.gain.exponentialRampToValueAtTime(0.06, now() + 4);

    const low = ctx.createOscillator();
    low.type = "sawtooth";
    low.frequency.value = 55;
    const low2 = ctx.createOscillator();
    low2.type = "sine";
    low2.frequency.value = 55.6;
    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 240;
    filter.Q.value = 2;
    low.connect(filter);
    low2.connect(filter);
    filter.connect(drone);
    low.start();
    low2.start();

    const lfo = ctx.createOscillator();
    lfo.type = "sine";
    lfo.frequency.value = 0.07;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = 0.018;
    lfo.connect(lfoGain);
    lfoGain.connect(drone.gain);

    if (!ensure()) return;
    const t = now();
    tone(784, t, 0.28, "sine", 0.07);
    tone(1175, t + 0.1, 0.34, "sine", 0.05);
  }

  function glitch() {
    if (!ensure()) return;
    const t = now();
    noiseBurst(t, 0.16, 0.09, 1200);
    noiseBurst(t + 0.05, 0.09, 0.05, 320);
    tone(92, t, 0.2, "sawtooth", 0.04);
  }

  function doorbell() {
    if (!ensure()) return;
    const t = now();
    tone(659, t, 0.5, "sine", 0.07);
    tone(523, t + 0.28, 0.7, "sine", 0.06);
  }

    const lens = [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 1, 0.5, 0.5, 0.5, 0.5, 1, 0.5, 0.5, 0.5, 1.5];

    for (let i = 0; i < seq.length; i += 1) {
      const f = notes[seq[i]] / 2;
      tone(f, t + cursor, lens[i] * 0.95, "triangle", 0.05);

      cursor += lens[i];
    }
    if (step === 2) {

    }
  }

  function hum() {
    if (!ensure()) return;
    const t = now();
    tone(146.8, t, 1.4, "sine", 0.04);
    tone(220, t + 0.2, 1.6, "sine", 0.025);
    tone(293.7, t + 0.5, 1.2, "sine", 0.018);

  function ending(kind) {
    if (!ensure()) return;
    const t = now();
    if (kind === "true") {
      const chord = [261.63, 329.63, 392.0, 523.25];
      for (let i = 0; i < chord.length; i += 1) {
        tone(chord[i], t + i * 0.18, 3.2, "sine", 0.055);
        tone(chord[i] * 2, t + i * 0.18, 2.4, "sine", 0.02);

      tone(130.81, t, 4, "triangle", 0.04);
    } else if (kind === "normal") {
      tone(196, t, 1.6, "sine", 0.05);
      tone(293.66, t + 0.3, 1.8, "sine", 0.035);
      tone(349.23, t + 0.9, 2.2, "sine", 0.03);
    } else {
      tone(110, t, 2.4, "sawtooth", 0.05);
      tone(82.41, t + 0.4, 2.8, "sine", 0.05);
      noiseBurst(t, 0.5, 0.05, 220);
      tone(55, t + 0.9, 3, "triangle", 0.045);
    }
  }

  function setMuted(next) {
    muted = next;
    try {
      window.localStorage.setItem(MUTE_KEY, next ? "1" : "0");
    } catch (err) {
      /* 저장할 수 없어도 소리는 유지한다 */
    }
    if (master && ctx) {
      master.gain.cancelScheduledValues(now());
      master.gain.setTargetAtTime(next ? 0 : 0.6, now(), 0.05);
    }
    return muted;
  }

  function isMuted() {
    return muted;
  }

  return {
    ensure: ensure,
    click: click,
    ping: ping,
    glitch: glitch,
    doorbell: doorbell,
    lullaby: lullaby,
    hum: hum,
    ending: ending,
    setMuted: setMuted,
    isMuted: isMuted,
  };
}

    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (err) {
    return [];
  }
}

function saveCodex() {
  try {
    window.localStorage.setItem(CODEX_KEY, JSON.stringify(codex));
  } catch (err) {
    /* 무시 */
  }
}

  if (codex.indexOf(id) === -1) {

}

function h(tag, props) {
  const node = document.createElement(tag);
  if (props) {
    const keys = Object.keys(props);
    for (let i = 0; i < keys.length; i += 1) {
      const key = keys[i];
      const value = props[key];
      if (value === null || value === undefined || value === false) continue;
      if (key === "class") node.className = value;
      else if (key === "text") node.textContent = value;
      else if (key === "on") {
        const events = Object.keys(value);
        for (let j = 0; j < events.length; j += 1) {
          node.addEventListener(events[j], value[events[j]]);
        }
      } else node.setAttribute(key, value === true ? "" : value);
    }
  }
  for (let i = 2; i < arguments.length; i += 1) {
    addChild(node, arguments[i]);
  }
  return node;
}

function addChild(node, child) {
  if (child === null || child === undefined || child === false) return;
  if (Array.isArray(child)) {
    for (let i = 0; i < child.length; i += 1) addChild(node, child[i]);
    return;
  }
  if (typeof child === "string" || typeof child === "number") {
    node.appendChild(document.createTextNode(String(child)));
    return;
  }
  node.appendChild(child);
}

function svg(paths, cls) {
  const s = document.createElementNS(SVGNS, "svg");
  s.setAttribute("viewBox", "0 0 24 24");
  s.setAttribute("aria-hidden", "true");
  if (cls) s.setAttribute("class", cls);
  for (let i = 0; i < paths.length; i += 1) {
    const p = document.createElementNS(SVGNS, "path");
    p.setAttribute("d", paths[i]);
    s.appendChild(p);
  }
  return s;
}

function paintMood() {
  const root = document.documentElement;
  if (!root || !root.classList) return;
  root.classList.remove("mood-1");
  root.classList.remove("mood-2");
  if (game.t >= 200) root.classList.add("mood-2");
  else if (game.t >= 180 || E.hasClue(game, "fire")) root.classList.add("mood-1");
}

function paintClock() {
  paintMood();
  if (!clockEl) return;
  clockEl.textContent = E.formatClock(game.t);
  if (game.t >= 200) clockEl.classList.add("is-late");
  else clockEl.classList.remove("is-late");
}

function availableMails() {
  const out = [];
  for (let i = 0; i < MAILS.length; i += 1) {
    const m = MAILS[i];
    let open = false;
    if (m.id === "delivery") open = true;
    else if (m.id === "bizno") open = !!game.read.delivery;
    else if (m.id === "driver") open = E.hasClue(game, "address");
    else if (m.id === "winter") open = E.hasClue(game, "yoonseul");
    else if (m.id === "keeper") open = E.hasClue(game, "fire");
    else if (m.id === "police") open = game.report === "missing";
    else if (m.id === "successor") open = E.truthCount(game) >= E.CORE_CLUES.length;
    else if (m.id === "last") open = game.t >= 200;
    if (open) out.push(m);
  }
  return out;
}

function unreadCount() {
  const list = availableMails();
  let n = 0;
  for (let i = 0; i < list.length; i += 1) if (!game.read[list[i].id]) n += 1;
  return n;
}

function paintTabs(routeName) {
  if (!tabbarEl) return;
  const unread = unreadCount();
  const tabs = [
    { name: "home", label: "홈", icon: "home", href: "#/" },
    { name: "search", label: "검색", icon: "search", href: "#/search" },
    { name: "mail", label: "쪽지", icon: "mail", href: "#/mail", dot: unread > 0 },

    { name: "endings", label: "도감", icon: "grid", href: "#/endings" },
  ];
  tabbarEl.replaceChildren();
  for (let i = 0; i < tabs.length; i += 1) {
    const t = tabs[i];
    const active = routeName === t.name;
    const a = h(
      "a",
      { class: "tab" + (t.dot ? " is-alert" : ""), href: t.href },
      icon(t.icon),
      h("span", { text: t.label }),
      t.dot ? h("span", { class: "tab__dot", "aria-hidden": "true" }) : null
    );
    if (active) a.setAttribute("aria-current", "page");
    tabbarEl.appendChild(a);

  if (muteEl) {
    const on = audio.isMuted();
    muteEl.setAttribute("aria-label", on ? "소리 켜기" : "소리 끄기");
    muteEl.replaceChildren(on ? icon("mute") : icon("sound"));

}

function go(hash) {
  if (location.hash === hash) render();
  else location.hash = hash;
}

function parseHash() {
  const raw = location.hash.replace(/^#\/?/, "");
  const qIndex = raw.indexOf("?");
  const pathPart = qIndex === -1 ? raw : raw.slice(0, qIndex);
  const queryPart = qIndex === -1 ? "" : raw.slice(qIndex + 1);
  const parts = pathPart.split("/").filter(Boolean);
  const q = {};
  if (queryPart) {
    const pairs = queryPart.split("&");
    for (let i = 0; i < pairs.length; i += 1) {
      const eq = pairs[i].indexOf("=");
      const k = eq === -1 ? pairs[i] : pairs[i].slice(0, eq);
      const v = eq === -1 ? "" : pairs[i].slice(eq + 1);
      q[decodeURIComponent(k)] = decodeURIComponent(v.replace(/\+/g, " "));
    }
  }
  return { name: parts[0] || "home", id: parts[1] || "", q: q };
}

function toast(message) {
  const old = document.querySelector(".toast");
  if (old) old.remove();
  const node = h("div", { class: "toast", role: "status", text: message });
  document.body.appendChild(node);
  window.clearTimeout(toastTimer);
  toastTimer = window.setTimeout(function () {
    node.remove();
  }, 2600);
}

function track(key, minutes) {
  if (E.visit(game, key, minutes)) save();
  paintClock();
}

function grant(id) {
  if (E.addClue(game, id)) {
    const clue = clueById(id);
    save();
    audio.ping();
    toast("수첩에 적었습니다 — " + (clue ? clue.title : "단서"));
    return true;
  }
  return false;
}

function glitchBurst() {
  appEl.classList.add("is-glitch");
  audio.glitch();
  window.setTimeout(function () {
    appEl.classList.remove("is-glitch");
  }, 280);
}

function openModal(spec) {
  closeModal();
  modalOpen = true;
  const box = h("div", { class: "backdrop", "aria-hidden": "false" });
  const dialog = h("div", { class: "dialog", role: "dialog", "aria-modal": "true" });
  if (spec.icon) dialog.appendChild(h("div", { class: "dialog__icon" }, icon(spec.icon)));
  dialog.appendChild(h("h2", { class: "dialog__title", text: spec.title }));
  if (spec.body) dialog.appendChild(h("p", { class: "dialog__body", text: spec.body }));
  if (spec.path) dialog.appendChild(h("p", { class: "dialog__path", text: spec.path }));
  if (spec.extra) dialog.appendChild(spec.extra);
  const actions = h("div", { class: "btn-row" });
  for (let i = 0; i < spec.actions.length; i += 1) {
    const a = spec.actions[i];
    const btn = h("button", {
      class: "btn " + (a.kind || "btn--ghost"),
      type: "button",
      text: a.label,
      on: {
        click: function () {
          audio.click();
          closeModal();
          if (a.onClick) a.onClick();
        },
      },
    });
    actions.appendChild(btn);
  }
  dialog.appendChild(actions);
  box.appendChild(dialog);
  box.addEventListener("click", function (event) {
    if (box === event.target) closeModal();
  });
  modalRoot.appendChild(box);
  const first = dialog.querySelector("button");
  if (first) first.focus();
}

function closeModal() {
  modalRoot.replaceChildren();
  modalOpen = false;
}

function checkTimed() {
  if (game.ended) return;
  if (!securityShown && game.t >= 183 && !game.securitySeen) {
    securityShown = true;
    window.setTimeout(showSecurityPrompt, 240);
    return;
  }
  if (!warned && game.t >= 205) {
    warned = true;
    toast("마감까지 " + E.minutesLeft(game) + "분. 새벽 세 시 삼십삼 분에 문을 닫습니다.");
    audio.ping();
  }
  if (game.t >= E.CLOSE_MIN) {
    closeModal();
    const endingId = E.resolveEnding(game);
    E.finish(game, endingId);
    unlockEnding(endingId);
    save();
    glitched = true;
    const def = ENDINGS[endingId];
    audio.ending(def && def.kind === "true" ? "true" : def && def.kind === "normal" ? "normal" : "bad");
    location.hash = "#/ending/" + endingId;
  }
}

function showSecurityPrompt() {
  if (game.ended || game.securitySeen) return;
  glitchBurst();
  openModal({
    icon: "alert",
    title: "정기 보안 검사",
    body:
      "소곤 안전지킴이가 위협 3건을 발견했습니다.\n\n· 이름\n· 주소\n· 기억\n\n치료를 권장합니다. 치료가 끝나면 쇼핑이 편해집니다.",
    path: "검사 시각 03:03 · 발급기관 확인 불가",
    actions: [
      {
        label: "나중에",
        kind: "btn--ghost",
        onClick: function () {
          E.setSecurity(game, "refuse");
          save();
          glitchBurst();
          toast("검사를 거부했습니다. 화면이 잠시 깨졌습니다.");
          render();
        },
      },
      {
        label: "치료하기",
        kind: "btn--danger",
        onClick: function () {
          E.setSecurity(game, "accept");
          save();
          glitchBurst();
          toast("3건이 정리되었습니다. 수첩이 비었습니다.");
          paintClock();
          render();
        },
      },
    ],
  });
  audio.ping();
}

/* ── 그리기 ──────────────────────────────────────────── */

function render() {
  const route = parseHash();
  if (!game.started && route.name !== "endings" && route.name !== "settings") {
    paintClock();
    paintTabs("home");
    viewEl.replaceChildren(openingView());
    return;
  }
  paintClock();
  paintTabs(route.name);
  const node = viewFor(route);
  viewEl.replaceChildren(node);
  const key = route.name + "/" + route.id + "/" + (route.q.q || "");
  if (key !== lastRouteKey) {
    lastRouteKey = key;
    window.scrollTo(0, 0);
  }
  checkTimed();
}

function viewFor(route) {
  switch (route.name) {
    case "home":
      return homeView();
    case "list":
      return listView(route.q.cat || selectedCategory);
    case "item":
      return itemView(route.id);
    case "cart":
      return cartView();
    case "order":
      return orderView();
    case "search":
      return searchView(route.q.q || "");
    case "mail":
      return route.id ? mailView(route.id) : mailListView();
    case "notice":
      return route.id ? noticeView(route.id) : noticeListView();
    case "report":
      return reportView();
    case "clues":
      return cluesView();
    case "endings":
      return endingsView();
    case "ending":
      return endingView(route.id);
    case "archive":
      return archiveView(route.id);
    case "about":
      return aboutView();
    case "settings":
      return settingsView();
    default:
      return notFoundView();
  }
}

  const grid = h("div", { class: "grid" });
  for (let i = 0; i < items.length; i += 1) {

    const thumb = h("div", { class: "thumb" });
    thumb.appendChild(art(p.id));
    thumb.appendChild(h("span", { class: "thumb__code", text: p.code }));
    if (p.id === "slipper") thumb.appendChild(h("span", { class: "thumb__flag", text: "한 짝" }));

    const body = h("div", { class: "card__body" });
    body.appendChild(h("span", { class: "card__name", text: p.name }));
    body.appendChild(h("span", { class: "card__meta", text: "평점 " + p.rating + " · 리뷰 " + p.reviews }));
    body.appendChild(h("span", { class: "price" }, won(p.price), h("span", { class: "price__unit", text: " / 1개" })));
    card.appendChild(body);

  return grid;
}

function reviewSection(p) {
  const shown = !!game.visits["reviews:" + p.id];
  const box = h("div", { class: "section" });
  const head = h("div", { class: "section__head" });
  head.appendChild(h("h2", { class: "section__title", text: "리뷰 " + p.reviews }));
  head.appendChild(h("span", { class: "section__sub", text: "평점 " + p.rating }));
  box.appendChild(head);
  const list = h("div");
  const count = shown ? p.reviewsList.length : Math.min(1, p.reviewsList.length);
  for (let i = 0; i < count; i += 1) {
    const r = p.reviewsList[i];
    const item = h("div", { class: "review" });
    const rhead = h("div", { class: "review__head" });
    rhead.appendChild(h("span", { class: "review__user", text: r.user }));
    rhead.appendChild(h("span", { class: "review__date", text: r.date }));
    rhead.appendChild(h("span", { class: "review__stars", text: "★".repeat(r.stars) }));
    item.appendChild(rhead);
    item.appendChild(h("p", { class: "review__body", text: r.text }));
    item.appendChild(h("p", { class: "review__foot", text: "도움돼요 " + r.helpful }));
    list.appendChild(item);
  }
  box.appendChild(list);
  if (!shown && p.reviewsList.length > 1) {
    box.appendChild(
      h("button", {
        class: "btn btn--quiet",
        type: "button",
        text: "리뷰 " + p.reviewsList.length + "개 모두 보기",
        on: {
          click: function () {
            track("reviews:" + p.id, 1);
            game.visits["reviews:" + p.id] = true;
            for (let i = 0; i < p.reviewsList.length; i += 1) {
              if (p.reviewsList[i].clue) grant(p.reviewsList[i].clue);
            }
            save();
            render();
          },
        },
      })
    );
  } else if (shown) {
    for (let i = 0; i < p.reviewsList.length; i += 1) {
      if (p.reviewsList[i].clue) E.addClue(game, p.reviewsList[i].clue);
    }
    save();
  }
  return box;
}

function qnaSection(p) {
  const key = "qna:" + p.id;
  const shown = !!game.visits[key];
  const box = h("div", { class: "section" });
  const head = h("div", { class: "section__head" });
  head.appendChild(h("h2", { class: "section__title", text: "Q&A " + p.qnaList.length }));
  head.appendChild(h("span", { class: "section__sub", text: "판매자 답변" }));
  box.appendChild(head);
  const count = shown ? p.qnaList.length : 1;
  for (let i = 0; i < count; i += 1) {
    const q = p.qnaList[i];
    const block = h("div", { class: "qna" });
    block.appendChild(
      h("p", { class: "qna__q" }, h("span", { class: "qna__mark", text: "Q" }), h("span", { text: q.q }))
    );
    const metaQ = h("div", { class: "qna__meta" });
    metaQ.appendChild(h("span", { text: q.qBy }));
    metaQ.appendChild(h("span", { text: q.qDate }));
    block.appendChild(metaQ);
    if (shown) {
      block.appendChild(
        h("p", { class: "qna__a" }, h("span", { class: "qna__mark", text: "A" }), h("span", { text: q.a }))
      );
      const metaA = h("div", { class: "qna__meta" });
      metaA.appendChild(h("span", { text: "판매자" }));
      metaA.appendChild(h("span", { text: q.aDate }));
      block.appendChild(metaA);
    } else {
      block.appendChild(h("p", { class: "qna__meta", text: "답변을 보려면 펼쳐 주세요." }));
    }
    box.appendChild(block);
  }
  if (!shown) {
    box.appendChild(
      h("button", {
        class: "btn btn--quiet",
        type: "button",
        text: "답변 " + p.qnaList.length + "개 보기",
        on: {
          click: function () {
            track(key, 1);
            game.visits[key] = true;
            for (let i = 0; i < p.qnaList.length; i += 1) {
              if (p.qnaList[i].clue) grant(p.qnaList[i].clue);
            }
            save();
            render();
          },
        },
      })
    );
  } else {
    for (let i = 0; i < p.qnaList.length; i += 1) {
      if (p.qnaList[i].clue) E.addClue(game, p.qnaList[i].clue);
    }
    save();
  }
  return box;
}

function payFlow() {
  if (!game.securitySeen) {
    securityShown = true;
    openModal({
      icon: "lock",
      title: "소곤 안전결제 인증서",
      body:

      path: "sogon.market / pay / cert",
      actions: [
        {
          label: "거부",
          kind: "btn--ghost",
          onClick: function () {
            E.setSecurity(game, "refuse");
            save();
            glitchBurst();
            toast("인증서 발급 이력을 확인할 수 없습니다.");
            render();
          },
        },
        {
          label: "갱신하고 결제",
          kind: "btn--danger",
          onClick: function () {
            E.setSecurity(game, "accept");
            save();
            glitchBurst();
            window.setTimeout(doPay, 400);
          },
        },
      ],
    });
    return;
  }
  openModal({
    icon: "alert",
    title: "주문을 확정할까요",
    body:
      "결제하면 " + won(E.cartTotal(game, PRODUCTS)) + "이 청구됩니다.\n\n배송지는 당신의 집입니다. 받는 사람은 당신이 아닙니다.",
    actions: [
      { label: "취소", kind: "btn--ghost" },
      {
        label: "확정",
        kind: "btn--danger",
        onClick: doPay,
      },
    ],
  });
}

function doPay() {
  if (!E.pay(game)) return;
  save();
  audio.ensure();
  audio.ping();
  E.advance(game, 2);
  save();
  openModal({
    icon: "lock",
    title: "결제 완료",
    body:
      "주문이 확정되었습니다.\n\n배송은 03:33에 시작됩니다. 문 앞에 두고, 벨은 울리지 않습니다.\n\n주문은 취소할 수 없습니다.",
    actions: [{ label: "확인", kind: "btn" }],
  });
  paintClock();
  if (game.t >= E.CLOSE_MIN) checkTimed();
}

function searchView(query) {
  const wrap = h("div");
  wrap.appendChild(
    h(
      "div",
      { class: "page-head" },
      h("p", { class: "kicker", text: "가게 안 검색" }),
      h("h1", { class: "page-title", text: "무엇을 찾으시나요" })
    )
  );
  const bar = h("form", { class: "searchbar" });
  const input = h("input", {
    class: "input",
    type: "search",
    name: "q",
    placeholder: "상품명, 단어, 숫자",
    "aria-label": "검색어",
    value: query,
    autocomplete: "off",
  });
  bar.appendChild(input);
  bar.appendChild(h("button", { class: "btn", type: "submit", text: "찾기" }));
  bar.addEventListener("submit", function (event) {
    event.preventDefault();
    audio.click();
    const value = input.value.trim();
    track("search:" + value, 2);
    go("#/search?q=" + encodeURIComponent(value));
  });
  wrap.appendChild(bar);

  const chips = h("div", { class: "chips", role: "group", "aria-label": "많이 찾는 검색어" });
  for (let i = 0; i < SEARCH_SUGGESTIONS.length; i += 1) {
    const word = SEARCH_SUGGESTIONS[i];
    chips.appendChild(
      h("a", { class: "chip", href: "#/search?q=" + encodeURIComponent(word), text: word })
    );
  }
  wrap.appendChild(chips);

  if (!query) {
    wrap.appendChild(
      h(
        "div",
        { class: "empty" },
        h("p", { class: "empty__title", text: "검색어를 입력해 주세요" }),
        h("p", { text: "상품 이름이나 기억나는 단어 하나면 됩니다." })
      )
    );
    return wrap;
  }

  const box = h("div");
  box.appendChild(h("div", { class: "skeleton" }));
  box.appendChild(h("p", { class: "section__sub", text: "불러오고 있어요" }));
  wrap.appendChild(box);

  const token = ++searchToken;
  window.setTimeout(function () {
    if (token !== searchToken) return;
    box.replaceChildren();
    const results = searchResults(query);
    if (results.length === 0) {
      box.appendChild(
        emptyBox("찾는 물건이 없어요", "다른 단어로 다시 시도해 주세요. 가게는 조용한 편입니다.")
      );
      const retry = h("button", {
        class: "btn btn--quiet",
        type: "button",
        text: "다시 검색하기",
        on: {
          click: function () {
            input.focus();
            input.select();
          },
        },
      });
      box.appendChild(retry);
      return;
    }
    for (let i = 0; i < results.length; i += 1) box.appendChild(results[i]);
  }, 260);
  return wrap;
}

function searchResults(query) {
  const q = query.trim().toLowerCase();
  const out = [];
  const products = PRODUCTS.filter(function (p) {
    const hay = (p.name + " " + p.tagline + " " + p.desc.join(" ") + " " + p.code).toLowerCase();
    return hay.indexOf(q) !== -1;
  });
  if (products.length) {
    const head = h("div", { class: "section__head" });
    head.appendChild(h("h2", { class: "section__title", text: "상품 " + products.length }));
    out.push(head);
    out.push(productGrid(products.slice(0, 6)));
  }

  const notices = NOTICES.filter(function (n) {
    return (n.title + " " + n.body).toLowerCase().indexOf(q) !== -1;
  });
  if (notices.length) {
    const head = h("div", { class: "section__head" });
    head.appendChild(h("h2", { class: "section__title", text: "공지 " + notices.length }));
    out.push(head);
    const rows = h("div", { class: "rows" });
    for (let i = 0; i < notices.length; i += 1) {
      rows.appendChild(
        h(
          "a",
          { class: "item-row", href: "#/notice/" + notices[i].id },
          h(
            "span",
            { class: "item-row__main" },
            h("span", { class: "item-row__title", text: notices[i].title }),
            h("span", { class: "item-row__sub", text: notices[i].date })
          )
        )
      );
    }
    out.push(rows);
  }

  const special = specialResult(q);
  if (special) out.unshift(special);
  return out;
}

function specialResult(q) {
  for (let k = 0; k < E.ENDING_IDS.length; k += 1) {
    const eid = E.ENDING_IDS[k];
    const edef = ENDINGS[eid];
    if (edef && hasEnding(eid) && edef.keyword === q) {
      const wrap = h("div", { class: "section" });
      wrap.appendChild(h("p", { class: "kicker", text: "숨은 기록" }));
      wrap.appendChild(
        h(
          "a",
          { class: "item-row", href: edef.hash },
          h(
            "span",
            { class: "item-row__main" },
            h("span", { class: "item-row__title", text: edef.tag + " — " + edef.title }),
            h("span", { class: "item-row__sub", text: "해금한 기록으로 이동합니다." })
          )
        )
      );
      return wrap;
    }
  }
  const map = {
    "1998": { archive: "fire", label: "1998년 12월 25일 지역신문", sub: "화재 · 302호 · 다섯 살 딸" },
    "실종": { archive: "missing", label: "찾은사람 공고 1998-1224-0333", sub: "정윤슬 · 1998년 12월 24일" },
    "송장": { archive: "label", label: "1998년 반품 회수 라벨", sub: "받는 사람 정미숙 · 보내는 사람 고만복" },
    "고만복": { archive: "fire", label: "기사에 나온 경비원", sub: "1998년 당시 51세 · 아이를 발견" },
    "자장가": { item: "clock", label: "3시 33분에 멈춘 벽시계", sub: "이 물건에서 노래가 납니다" },
    "윤슬": {
      archive: "missing",
      label: "정윤슬 (여, 1993년생)",
      sub: E.hasClue(game, "yoonseul") ? "쪽지함에 이 이름으로 온 편지가 있습니다." : "1998년 12월 24일 실종",
    },
    "0333": { notice: "maintenance", label: "시스템 점검 안내", sub: "03:33 ~ 03:34" },
    "정미숙": { about: true, label: "판매자 정보", sub: "대표 정미숙 · 1998년 개업" },
  };
  if (map[q]) {
    const item = map[q];
    const head = h("div", { class: "section__head" });
    head.appendChild(h("h2", { class: "section__title", text: "가게 기록" }));
    const wrap = h("div");
    wrap.appendChild(head);
    let href = "#/about";
    if (item.archive) href = "#/archive/" + item.archive;
    else if (item.item) href = "#/item/" + item.item;
    else if (item.notice) href = "#/notice/" + item.notice;
    wrap.appendChild(
      h(
        "a",
        { class: "item-row", href: href },
        h(
          "span",
          { class: "item-row__main" },
          h("span", { class: "item-row__title", text: item.label }),
          h("span", { class: "item-row__sub", text: item.sub })
        ),
        h("span", { class: "item-row__side", text: "기록" })
      )
    );
    return wrap;
  }

  return null;
}

    },
    {

      locked: !E.hasClue(game, "lullaby"),
    },
  ];
  const extra = h("div");
  for (let i = 0; i < options.length; i += 1) {
    const opt = options[i];
    const button = h(
      "button",
      {
        class: "radio-row",
        type: "button",
        disabled: opt.locked ? true : null,
        on: {

            E.sendMessage(game, "winter", opt.id);

            toast("답장을 보냈습니다.");

          },

      h(
        "span",

        h("span", { class: "radio-row__title", text: opt.label }),
        h("span", { class: "radio-row__sub", text: opt.sub })
      )
    );
    extra.appendChild(button);
  }
  openModal({
    icon: "mail",
    title: "겨울손에게 답장",
    body: "한 번 보내면 되돌릴 수 없습니다. 새벽 세 시 삼십삼 분 전에 도착합니다.",

    const r = REPORTS[i];
    const label = h("label", { class: "radio-row" });
    const radio = h("input", { type: "radio", name: "kind", value: r.id });
    radio.addEventListener("change", function () {
      picked = r.id;
      detail.textContent = r.body;
    });
    label.appendChild(radio);
    label.appendChild(
      h(
        "span",
        { class: "radio-row__main" },
        h("span", { class: "radio-row__title", text: r.title }),
        h("span", { class: "radio-row__sub", text: r.sub })
      )
    );
    form.appendChild(label);
  }
  const detail = h("p", { class: "note", text: "제보 유형을 고르면 안내가 표시됩니다." });
  form.appendChild(detail);
  const textarea = h("textarea", {
    class: "textarea",
    placeholder: "제보 내용을 적어 주세요",
    "aria-label": "제보 내용",
    maxlength: "400",
  });
  form.appendChild(textarea);
  form.appendChild(
    h("button", {
      class: "btn",
      type: "submit",
      text: "제보 접수",
    })
  );
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    if (!picked) {
      toast("제보 유형을 골라 주세요.");
      return;
    }
    submitReport(picked, textarea.value.trim());
  });
  wrap.appendChild(form);
  return wrap;
}

function submitReport(kind, detail) {
  if (kind === "fraud") {
    openModal({
      icon: "alert",
      title: "사기 신고를 접수할까요",
      body:
        "접수되면 상점은 즉시 휴업 처리됩니다. 등록된 상품과 27년간의 기록이 모두 비공개로 전환됩니다.\n\n이 신고는 취소할 수 없습니다.",
      actions: [
        { label: "취소", kind: "btn--ghost" },
        {
          label: "신고 접수",
          kind: "btn--danger",
          onClick: function () {
            E.report(game, "fraud", detail);
            E.advance(game, 4);
            save();
            paintClock();
            audio.glitch();
            toast("신고가 접수되었습니다. 상점이 곧 휴업됩니다.");
            render();
          },
        },
      ],
    });
    return;
  }
  if (kind === "missing") {
    const knows = E.hasClue(game, "missing") || E.hasClue(game, "fire");
    if (!knows) {
      toast("사건번호를 확인할 수 없습니다. 기록을 먼저 찾아 주세요.");
      return;
    }
    E.report(game, "missing", detail);
    E.advance(game, 5);
    save();
    paintClock();
    audio.ping();
    openModal({
      icon: "note",
      title: "제보가 접수되었습니다",
      body:
        "사건번호 1998-1224-0333으로 접수되었습니다.\n\n확인 결과는 새벽에 쪽지로 보내드립니다. 담당자: 성동경찰서 실종수사팀",
      actions: [{ label: "확인", kind: "btn" }],
    });
    render();
    return;
  }
  E.report(game, "noise", detail);
  E.advance(game, 2);
  save();
  paintClock();
  toast("접수되었습니다. 담당자가 곧 확인합니다.");
  openModal({
    icon: "alert",
    title: "소음 신고 접수",
    body:
      "확인 결과, 해당 주소는 1998년 이후 공실 기록이 여러 번 있습니다.\n\n현재 거주자 정보는 확인되지 않습니다. 신고자 본인이 거주 중이라면, 관리사무소에 방문해 주세요.",
    actions: [{ label: "닫기", kind: "btn--ghost" }],
  });
}

function archiveView(id) {
  track("archive:" + id, 2);
  const doc = ARCHIVES[id];
  if (doc) {
    const wrap = h("div");
    wrap.appendChild(
      h(
        "div",
        { class: "page-head" },
        h("p", { class: "kicker", text: "가게 기록 · " + doc.date }),
        h("h1", { class: "page-title", text: doc.title })
      )
    );
    if (doc.kind === "clipping") {
      const clip = h("div", { class: "clipping" });
      clip.appendChild(
        h("div", { class: "clipping__head" }, h("span", { text: doc.head }), h("span", { text: doc.date }))
      );
      clip.appendChild(h("p", { class: "clipping__title", text: doc.headline }));
      clip.appendChild(h("p", { class: "clipping__body", text: doc.body }));
      clip.appendChild(h("span", { class: "stamp", text: doc.stamp }));
      wrap.appendChild(clip);
    } else {
      wrap.appendChild(
        h(
          "div",
          { class: "doc__meta" },
          h("span", { text: doc.head }),
          h("span", { text: doc.date })
        )
      );
      wrap.appendChild(h("h2", { class: "page-title", text: doc.headline }));
      wrap.appendChild(h("p", { class: "doc", text: doc.body }));
    }
    if (doc.clue) grant(doc.clue);
    if (id === "fire") grant("keeper");
    if (id === "label") grant("label");
    wrap.appendChild(h("a", { class: "link-more", href: "#/search", text: "가게로 돌아가기" }));
    return wrap;
  }

  for (let i = 0; i < E.ENDING_IDS.length; i += 1) {
    const def = ENDINGS[E.ENDING_IDS[i]];
    if (def && def.hash === "#/archive/" + id) {
      const wrap = h("div");
      wrap.appendChild(
        h(
          "div",
          { class: "page-head" },
          h("p", { class: "kicker", text: "숨은 기록 · " + def.tag }),
          h("h1", { class: "page-title", text: def.secret.title })
        )
      );
      wrap.appendChild(h("p", { class: "doc", text: def.secret.body }));
      wrap.appendChild(
        h("p", { class: "note", text: "이 기록은 " + def.title + " 엔딩을 본 뒤에만 남습니다." })
      );
      wrap.appendChild(h("a", { class: "link-more", href: "#/endings", text: "엔딩 도감으로" }));
      return wrap;
    }
  }
  return notFoundView();
}

    )
  );
  wrap.appendChild(emptyBox("이 주소에는 아무것도 없어요", "가게가 잠시 문을 닫았을 수 있습니다."));
  wrap.appendChild(h("a", { class: "btn btn--ghost", href: "#/", text: "홈으로 돌아가기" }));
  return wrap;
}

/* ── 시작 ────────────────────────────────────────────── */

function boot() {
  if (!location.hash) location.hash = "#/";
  render();
}

window.addEventListener("hashchange", function () {
  audio.ensure();
  render();
});

backEl.addEventListener("click", function () {
  audio.click();
  if (history.length > 1) history.back();
  else go("#/");
});

muteEl.addEventListener("click", function () {
  audio.ensure();
  audio.setMuted(!audio.isMuted());
  paintTabs(parseHash().name);
  toast(audio.isMuted() ? "소리를 꺼습니다." : "소리를 켰습니다.");
});

document.addEventListener("keydown", function (event) {
  if (event.key === "Escape" && modalOpen) closeModal();
});

document.addEventListener(
  "click",
  function () {
    audio.ensure();
  },
  { once: true }
);

boot();

})();
</script>
  </body>
</html>
