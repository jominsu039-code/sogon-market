<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f2f4f6" />
    <meta
      name="description"
      content="소곤마켓 — 새벽 배송. 평범한 쇼핑몰에서 시작해 1998년 사건 기록까지 내려가는 한국어 인터랙티브 추리 호러."
    />
    <title>소곤마켓 — 새벽 배송</title>
    <style>
/* 소곤마켓 — 디자인 토큰. 색은 이 파일에서만 정의한다.
   낮의 쇼핑몰(라이트) → 밤의 새벽관(다크) → 경찰청 포털(관공서)까지
   같은 이름의 토큰을 세계마다 갈아 끼운다. */

:root {
  /* ── 표면 ── */
  --bg: #f2f4f6;
  --bg-2: #ffffff;
  --bg-card: #ffffff;
  --bg-card-2: #f6f8fa;
  --bg-inset: #eef1f4;
  --line: #e2e6eb;
  --line-soft: #eef1f4;

  /* ── 글자 ── */
  --fg: #191f28;
  --fg-2: #4e5968;
  --fg-3: #656f7c;
  --fg-inverse: #ffffff;
  --fg-paper: #23201a;

  /* ── 강조 ── */
  --brand: #1b64da;
  --brand-dim: #10408f;
  --brand-soft: #e7f0fd;
  --sale: #d92d20;
  --sale-soft: #fdeceb;
  --ok: #1f7a53;
  --ok-soft: #e8f5ee;
  --star: #f2a20c;
  --warn: #b45309;

  /* ── 세계별 전용 ── */
  --chrome-bg: #e9edf1;
  --hero-bg: #dbe7fb;
  --hero-ink: #10254a;
  --overlay: rgba(10, 14, 20, 0.55);
  --shadow: 0 2px 8px rgba(16, 24, 40, 0.08);
  --shadow-lift: 0 8px 24px rgba(16, 24, 40, 0.16);

  /* 경찰청 포털 */
  --gov-bg: #ffffff;
  --gov-fg: #16233a;
  --gov-fg-2: #46556e;
  --gov-line: #d5dde8;
  --gov-card: #f7f9fc;
  --gov-navy: #102a56;
  --gov-navy-2: #1b3e78;
  --gov-red: #bb2d20;
  --gov-red-soft: #fbeceb;

  /* 검색 엔진 */
  --se-bg: #ffffff;
  --se-fg: #1f2937;
  --se-fg-2: #5b6573;
  --se-line: #e3e7ec;
  --se-link: #1a0dab;
  --se-url: #1f7a3f;
  --se-ad: #f4f7fb;

  /* 그림 팔레트 (SVG) */
  --a-paper: #ffffff;
  --a-paper-2: #e9edf2;
  --a-metal: #c3ccd6;
  --a-metal-2: #93a0af;
  --a-metal-3: #5f6b7a;
  --a-dark: #23272e;
  --a-ink: #2b3138;
  --a-accent: #1b64da;
  --a-red: #cf3a2f;
  --a-red-2: #8c231c;
  --a-gold: #e0a12b;
  --a-green: #2f855a;
  --a-blue: #3b74c9;
  --a-pink: #e08a9a;
  --a-skin: #e8c3a8;
  --a-hair: #2c2622;
  --a-glass: #cfe0ee;
  --a-wood: #b08968;
  --a-shadow: rgba(15, 20, 25, 0.18);
  --a-shine: rgba(255, 255, 255, 0.72);
  --a-blood: #8f1f1a;
  --a-blood-2: #b8261f;
  --a-night: #10141a;
  --a-night-2: #1b212a;
  --a-fog: #c9d2dc;

  /* ── 모서리 (4단계) ── */
  --r-sm: 4px;
  --r-md: 10px;
  --r-lg: 18px;
  --r-pill: 999px;

  /* ── 여백 ── */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --sp-7: 40px;

  /* ── 글자 7단계 ── */
  --t-1: 12px;
  --t-2: 13px;
  --t-3: 14px;
  --t-4: 16px;
  --t-5: 19px;
  --t-6: 24px;
  --t-7: 32px;

  /* ── 안전 영역 ── */
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);

  --ease: cubic-bezier(0.2, 0, 0, 1);
}

/* ── 밤: 새벽 배송이 열린 뒤의 가게 ── */
html.mood-night {
  --bg: #0a0b0d;
  --bg-2: #111318;
  --bg-card: #14171d;
  --bg-card-2: #1a1e26;
  --bg-inset: #0e1116;
  --line: #262c36;
  --line-soft: #1d222a;

  --fg: #e8ecf2;
  --fg-2: #b4bcc8;
  --fg-3: #8d97a6;

  --brand: #b83a2c;
  --brand-dim: #8a2a20;
  --brand-soft: #2a1614;
  --sale: #e0594b;
  --sale-soft: #2a1412;
  --ok: #6fae8f;
  --ok-soft: #12241c;
  --star: #d9a13a;
  --warn: #d99a4a;

  --chrome-bg: #0d1015;
  --hero-bg: #191b1f;
  --hero-ink: #e8ecf2;
  --overlay: rgba(0, 0, 0, 0.72);
  --shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
  --shadow-lift: 0 8px 24px rgba(0, 0, 0, 0.6);

  --a-paper: #d9d3c7;
  --a-paper-2: #b8b2a6;
  --a-metal: #8e99a6;
  --a-metal-2: #69747f;
  --a-metal-3: #454e58;
  --a-glass: #6f8496;
}

/* ── 경찰청 포털: 종이와 남색 ── */
.world-gov,
.gov {
  --bg: #ffffff;
  --bg-2: #ffffff;
  --bg-card: #ffffff;
  --bg-card-2: #f7f9fc;
  --bg-inset: #eef2f7;
  --line: #d5dde8;
  --line-soft: #e6ecf3;
  --fg: #16233a;
  --fg-2: #46556e;
  --fg-3: #5f6d84;
  --brand: #102a56;
  --brand-dim: #1b3e78;
  --brand-soft: #e8eef7;
  --sale: #bb2d20;
  --sale-soft: #fbeceb;
}

/* ── 검색 엔진: 흰 종이 ── */
.world-se {
  --bg: #ffffff;
  --bg-2: #ffffff;
  --bg-card: #ffffff;
  --bg-card-2: #f5f7fa;
  --bg-inset: #eef1f5;
  --line: #e3e7ec;
  --line-soft: #f0f2f5;
  --fg: #1f2937;
  --fg-2: #4b5563;
  --fg-3: #6b7280;
  --brand: #1a56c4;
  --brand-dim: #123d8a;
  --brand-soft: #eaf1fd;
  --sale: #c0392b;
  --sale-soft: #fbeceb;
}

/* ── 어두운 OS 창(메신저·오류창) ── */
.world-os {
  --bg: #0f1115;
  --bg-2: #161922;
  --bg-card: #1a1e27;
  --bg-card-2: #212631;
  --bg-inset: #0c0e12;
  --line: #2b3240;
  --line-soft: #232935;
  --fg: #e6eaf0;
  --fg-2: #b3bcc9;
  --fg-3: #8b95a4;
  --brand: #3d7bff;
  --brand-soft: #14213c;
  --sale: #e0594b;
  --sale-soft: #2a1412;
}

/* 소곤마켓 — 화면 스타일. 색은 tokens.css의 변수만 쓴다.
   낮의 쇼핑몰, 브라우저 창, 경찰청 포털, 메신저, 현관 복도까지 한 파일에서 다룬다. */

*,
*::before,
*::after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

button,
a,
.pcard,
.btn {
  -webkit-user-select: none;
  user-select: none;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: var(--bg);
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  color: var(--fg);
  font-family: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", system-ui, -apple-system,
    "Malgun Gothic", sans-serif;
  font-size: var(--t-4);
  line-height: 1.55;
  letter-spacing: -0.012em;
  word-break: keep-all;
  overscroll-behavior: none;
  touch-action: manipulation;
  -webkit-font-smoothing: antialiased;
  transition: background-color 220ms var(--ease), color 220ms var(--ease);
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 90;
  pointer-events: none;
  background-image: linear-gradient(
    to bottom,
    rgba(0, 0, 0, 0) 0%,
    rgba(0, 0, 0, 0.18) 50%,
    rgba(0, 0, 0, 0) 100%
  );
  background-size: 100% 4px;
  opacity: 0.12;
  mix-blend-mode: multiply;
}

html.mood-night body::before {
  opacity: 0.5;
}

h1,
h2,
h3,
p,
ul,
ol,
figure,
dl,
dd,
dt {
  margin: 0;
  padding: 0;
}

ul,
ol {
  list-style: none;
}

a {
  color: inherit;
  text-decoration: none;
}

button {
  font: inherit;
  color: inherit;
  border: 0;
  background: none;
  cursor: pointer;
}

svg {
  display: block;
}

::selection {
  background: var(--brand-soft);
  color: var(--fg);
}

::-webkit-scrollbar {
  width: 0;
  height: 0;
  display: none;
}

:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
}

.glyph {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ── 바탕 효과 ───────────────────────────────────────── */

.grain {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 80;
  pointer-events: none;
  opacity: 0.05;
  mix-blend-mode: multiply;
}

html.mood-night .grain {
  opacity: 0.11;
  mix-blend-mode: screen;
}

.vignette {
  position: fixed;
  inset: 0;
  z-index: 79;
  pointer-events: none;
  background-image: radial-gradient(ellipse at 50% 45%, rgba(0, 0, 0, 0) 42%, rgba(0, 0, 0, 0.55) 100%);
  opacity: 0.35;
}

html.mood-night .vignette {
  opacity: 0.8;
}

.seam {
  position: fixed;
  left: 0;
  right: 0;
  bottom: var(--sab);
  height: 1px;
  z-index: 78;
  pointer-events: none;
  background: var(--line);
  opacity: 0.4;
}

/* ── 앱 틀 ───────────────────────────────────────────── */

.app {
  position: relative;
  max-width: 560px;
  margin: 0 auto;
  min-height: 100dvh;
  background: var(--bg);
  overflow-x: hidden;
}

.app.is-shake {
  animation: shake 260ms var(--ease) 1;
}

.app.is-flash {
  animation: glitchflash 220ms steps(2) 1;
}

@keyframes shake {
  0% { transform: translate3d(0, 0, 0); }
  20% { transform: translate3d(-5px, 2px, 0); }
  40% { transform: translate3d(4px, -3px, 0); }
  60% { transform: translate3d(-3px, 1px, 0); }
  80% { transform: translate3d(2px, -1px, 0); }
  100% { transform: translate3d(0, 0, 0); }
}

@keyframes glitchflash {
  0% { filter: none; }
  35% { filter: invert(1) hue-rotate(80deg) contrast(1.4); }
  70% { filter: invert(0.2) hue-rotate(-40deg); }
  100% { filter: none; }
}

.view {
  display: block;
}

.chrome {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--chrome-bg);
  border-bottom: 1px solid var(--line);
  padding-top: var(--sat);
  transition: opacity 180ms var(--ease);
}

.chrome.is-hidden,
.dock.is-hidden {
  display: none;
}

.chrome__tabs {
  display: flex;
  align-items: flex-end;
  gap: 4px;
  padding: 8px 8px 0;
}

.chrome__tab {
  flex: 1 1 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 44px;
  padding: 0 8px;
  border-radius: var(--r-md) var(--r-md) 0 0;
  background: var(--bg-card-2);
  color: var(--fg-3);
  font-size: var(--t-2);
  font-weight: 600;
  overflow: hidden;
  white-space: nowrap;
}

.chrome__tab.is-on {
  background: var(--bg-2);
  color: var(--fg);
  box-shadow: 0 -2px 0 var(--brand) inset;
}

.chrome__favicon {
  width: 14px;
  height: 14px;
  border-radius: var(--r-sm);
  background: var(--brand);
  opacity: 0.75;
  flex: none;
}

.chrome__tab.is-on .chrome__favicon {
  opacity: 1;
}

.chrome__label {
  overflow: hidden;
  text-overflow: ellipsis;
}

.chrome__bar {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 8px 8px;
  background: var(--bg-2);
  border-bottom: 1px solid var(--line-soft);
}

.chrome__icon {
  flex: none;
  width: 40px;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--fg-2);
}

.chrome__url {
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 0 12px;
  border-radius: var(--r-pill);
  background: var(--bg-card-2);
  border: 1px solid var(--line);
  overflow: hidden;
}

.chrome__lock {
  flex: none;
  width: 14px;
  height: 14px;
  color: var(--ok);
}

.chrome__lock svg {
  width: 14px;
  height: 14px;
}

.chrome__clock {
  flex: none;
  padding: 0 4px;
  font-size: var(--t-1);
  font-weight: 800;
  color: var(--fg-2);
  letter-spacing: 0.02em;
}

html.mood-night .chrome__clock {
  color: var(--sale);
}

.chrome__text {
  font-size: var(--t-2);
  word-break: normal;
  overflow-wrap: anywhere;
  color: var(--fg-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: 0;
}

.dock {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 45;
  background: var(--bg-2);
  border-top: 1px solid var(--line);
  padding-bottom: var(--sab);
}

.dock__inner {
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  align-items: stretch;
}

.dock__item {
  position: relative;
  flex: 1 1 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: 56px;
  color: var(--fg-3);
  font-size: var(--t-1);
}

.dock__item.is-on {
  color: var(--brand);
}

.dock__glyph {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.dock__badge {
  position: absolute;
  top: 8px;
  right: 26%;
  width: 8px;
  height: 8px;
  border-radius: var(--r-pill);
  background: var(--sale);
  animation: pulse-dot 2.2s infinite;
}

.dock__mute {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  color: var(--fg-3);
}

@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}

/* ── 기본 조판 ───────────────────────────────────────── */

.page {
  padding: 16px 16px 168px;
  animation: pagein 200ms var(--ease) 1;
}

@keyframes pagein {
  from { opacity: 0; transform: translate3d(0, 6px, 0); }
  to { opacity: 1; transform: translate3d(0, 0, 0); }
}

.kicker {
  font-size: var(--t-1);
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--fg-3);
  text-transform: uppercase;
}

.pagehead {
  padding: 8px 0 16px;
}

.pagehead__title {
  margin-top: 4px;
  font-size: var(--t-6);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.25;
}

.fineprint {
  margin: 16px 0 8px;
  font-size: var(--t-1);
  color: var(--fg-3);
  line-height: 1.5;
}

.empty {
  padding: 40px 16px;
  text-align: center;
  color: var(--fg-2);
  font-size: var(--t-3);
}

.empty p {
  margin-bottom: 16px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 52px;
  padding: 0 20px;
  border-radius: var(--r-md);
  background: var(--brand);
  color: var(--fg-inverse);
  font-size: var(--t-4);
  font-weight: 700;
  border: 1px solid transparent;
  transition: transform 120ms var(--ease), opacity 160ms var(--ease), background-color 160ms var(--ease);
}

.btn:active {
  transform: scale(0.98);
}

.btn:disabled {
  opacity: 0.4;
}

.btn--ghost {
  background: var(--bg-card);
  color: var(--fg);
  border-color: var(--line);
}

.btn--quiet {
  background: var(--bg-card-2);
  color: var(--fg);
}

.btn--danger {
  background: var(--sale);
  color: var(--fg-inverse);
}

.btn--sm {
  min-height: 44px;
  padding: 0 14px;
  font-size: var(--t-3);
}

.btn--block {
  display: flex;
  width: 100%;
  margin-top: 8px;
}

.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.btn-row .btn {
  flex: 1 1 auto;
}

.badge {
  position: absolute;
  top: 8px;
  left: 8px;
  padding: 4px 8px;
  border-radius: var(--r-sm);
  background: var(--brand-soft);
  color: var(--brand-dim);
  font-size: var(--t-1);
  font-weight: 700;
}

.badge--red {
  background: var(--sale);
  color: var(--fg-inverse);
}

.badge--muted {
  background: var(--bg-inset);
  color: var(--fg-3);
}

.tag {
  display: inline-block;
  padding: 2px 6px;
  border-radius: var(--r-sm);
  font-size: var(--t-1);
  font-weight: 700;
}

.tag--red {
  background: var(--sale-soft);
  color: var(--sale);
}

.stars {
  display: inline-flex;
  gap: 1px;
  vertical-align: middle;
}

.stars__icon {
  width: 14px;
  height: 14px;
}

.stars--sm .stars__icon {
  width: 12px;
  height: 12px;
}

.is-ok { color: var(--ok); }
.is-bad { color: var(--sale); }

/* ── 토스트·모달 ─────────────────────────────────────── */

.toast {
  position: fixed;
  left: 50%;
  top: calc(104px + var(--sat));
  bottom: auto;
  transform: translateX(-50%);
  z-index: 120;
  max-width: 300px;
  padding: 12px 16px;
  border-radius: var(--r-md);
  background: var(--fg);
  color: var(--bg-2);
  font-size: var(--t-3);
  line-height: 1.45;
  box-shadow: var(--shadow-lift);
  animation: toastin 180ms var(--ease) 1;
}

html.mood-night .toast {
  background: var(--bg-card-2);
  color: var(--fg);
  border: 1px solid var(--line);
}

@keyframes toastin {
  from { opacity: 0; transform: translate(-50%, 8px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

.backdrop {
  position: fixed;
  inset: 0;
  z-index: 110;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 16px;
  padding-bottom: calc(16px + var(--sab));
  background: var(--overlay);
  animation: fadein 160ms var(--ease) 1;
}

@keyframes fadein {
  from { opacity: 0; }
  to { opacity: 1; }
}

.dialog {
  width: 100%;
  max-width: 440px;
  max-height: 82dvh;
  overflow-y: auto;
  padding: 24px 20px 20px;
  border-radius: var(--r-lg);
  background: var(--bg-card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-lift);
  animation: sheetin 220ms var(--ease) 1;
}

@keyframes sheetin {
  from { transform: translate3d(0, 14px, 0); opacity: 0.6; }
  to { transform: translate3d(0, 0, 0); opacity: 1; }
}

.dialog__title {
  margin: 6px 0 12px;
  font-size: var(--t-5);
  font-weight: 800;
  line-height: 1.3;
}

.dialog__body {
  color: var(--fg-2);
  font-size: var(--t-3);
  line-height: 1.6;
}

.dialog__gap {
  height: 8px;
}

.scanbox {
  margin-top: 16px;
  padding: 12px;
  border-radius: var(--r-md);
  background: var(--bg-inset);
  border: 1px solid var(--line);
}

.scanbox__label {
  font-size: var(--t-2);
  font-weight: 700;
  color: var(--fg-2);
}

.scanbox__bar {
  margin: 8px 0;
  height: 8px;
  border-radius: var(--r-pill);
  background: var(--line);
  overflow: hidden;
}

.scanbox__fill {
  display: block;
  width: 37%;
  height: 100%;
  background: var(--sale);
  animation: glow-scan 2.4s var(--ease) infinite;
}

@keyframes glow-scan {
  0% { width: 4%; }
  70% { width: 88%; }
  100% { width: 100%; }
}

.scanbox__note {
  font-size: var(--t-1);
  color: var(--fg-3);
}

/* ── 시작 화면 ───────────────────────────────────────── */

.splash {
  min-height: 100dvh;
  padding: 48px 24px calc(24px + var(--sab));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  text-align: center;
}

.splash__mark svg {
  width: 56px;
  height: 56px;
}

.splash__date {
  margin-top: 24px;
  font-size: var(--t-1);
  letter-spacing: 0.14em;
  color: var(--fg-3);
}

.splash__title {
  margin-top: 8px;
  font-size: var(--t-7);
  font-weight: 800;
  letter-spacing: -0.04em;
}

.splash__sub {
  margin-top: 4px;
  font-size: var(--t-3);
  color: var(--fg-2);
  letter-spacing: 0.3em;
}

.splash__since {
  margin-top: 8px;
  font-size: var(--t-1);
  color: var(--fg-3);
  letter-spacing: 0.1em;
}

.splash__hours {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  font-size: var(--t-1);
  color: var(--fg-3);
  letter-spacing: 0.02em;
}

.splash__lines {
  margin-top: 32px;
  max-width: 320px;
}

.splash__line {
  font-size: var(--t-3);
  color: var(--fg-2);
  line-height: 1.9;
  animation: drift-in 380ms var(--ease) both;
}

.splash__line:nth-child(2) { animation-delay: 120ms; }
.splash__line:nth-child(3) { animation-delay: 240ms; }
.splash__line:nth-child(4) { animation-delay: 360ms; }

@keyframes drift-in {
  from { opacity: 0; transform: translate3d(0, 4px, 0); }
  to { opacity: 1; transform: translate3d(0, 0, 0); }
}

.splash__foot {
  margin-top: 40px;
  width: 100%;
  max-width: 320px;
}

.splash__note {
  margin-top: 16px;
  font-size: var(--t-1);
  color: var(--fg-3);
}

/* ── 쇼핑몰 머리 ─────────────────────────────────────── */

.mallhead {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 4px 0 12px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-right: auto;
}

.logo svg {
  width: 30px;
  height: 30px;
}

.logo__text {
  font-size: var(--t-5);
  font-weight: 800;
  letter-spacing: -0.04em;
}

.mallhead__tools {
  display: flex;
  align-items: center;
  gap: 4px;
}

.icon-btn {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  min-height: 44px;
  border-radius: var(--r-md);
  color: var(--fg-2);
}

.cartbtn__badge {
  position: absolute;
  top: 6px;
  right: 4px;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: var(--r-pill);
  background: var(--sale);
  color: var(--fg-inverse);
  font-size: var(--t-1);
  font-weight: 700;
  line-height: 16px;
  text-align: center;
}

.searchbar {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: 48px;
  padding: 0 16px;
  border-radius: var(--r-pill);
  background: var(--bg-card-2);
  border: 1px solid var(--line);
  color: var(--fg-3);
  text-align: left;
}

.searchbar__glyph {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
}

.searchbar__text {
  font-size: var(--t-3);
}

/* ── 히어로 ──────────────────────────────────────────── */

.hero {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 12px 0 16px;
  padding: 20px;
  border-radius: var(--r-lg);
  background: var(--hero-bg);
  color: var(--hero-ink);
  overflow: hidden;
}

.hero--night {
  background: var(--bg-card-2);
  color: var(--fg);
  border: 1px solid var(--line);
}

.hero__copy {
  flex: 1 1 auto;
  min-width: 0;
}

.hero__kicker {
  font-size: var(--t-1);
  font-weight: 700;
  letter-spacing: 0.12em;
  opacity: 0.7;
}

.hero__title {
  margin: 6px 0 8px;
  font-size: var(--t-6);
  font-weight: 800;
  line-height: 1.2;
  letter-spacing: -0.04em;
  white-space: pre-line;
}

.hero__body {
  font-size: var(--t-2);
  line-height: 1.5;
  opacity: 0.78;
}

.hero__stamp {
  display: inline-block;
  margin-top: 12px;
  padding: 4px 10px;
  border-radius: var(--r-sm);
  background: var(--bg-card);
  color: var(--brand-dim);
  font-size: var(--t-1);
  font-weight: 800;
}

.hero--night .hero__stamp {
  background: var(--sale-soft);
  color: var(--sale);
}

.hero__art {
  flex: none;
  width: 112px;
  height: 112px;
}

.hero__art svg {
  width: 100%;
  height: 100%;
}

/* ── 패널 ────────────────────────────────────────────── */

.panel {
  margin: 12px 0;
  padding: 16px;
  border-radius: var(--r-lg);
  background: var(--bg-card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}

.panel__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}

.panel__title {
  margin-top: 2px;
  font-size: var(--t-5);
  font-weight: 800;
  letter-spacing: -0.03em;
}

.panel__budget {
  flex: none;
  font-size: var(--t-1);
  color: var(--fg-3);
  padding-top: 4px;
}

.panel__hint {
  margin-top: 10px;
  font-size: var(--t-2);
  color: var(--fg-2);
  line-height: 1.55;
}

.panel--alert {
  border-color: var(--sale);
  background: var(--sale-soft);
}

.panel--danger {
  border-color: var(--sale);
}

.check {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-top: 1px solid var(--line-soft);
}

.check:first-of-type {
  border-top: 0;
}

.check__box {
  flex: none;
  width: 20px;
  height: 20px;
  border-radius: var(--r-sm);
  border: 1.5px solid var(--line);
  background: var(--bg-2);
  color: var(--fg-inverse);
  font-size: var(--t-1);
  font-weight: 800;
  line-height: 17px;
  text-align: center;
}

.check__box.is-on {
  background: var(--brand);
  border-color: var(--brand);
}

.check__art {
  flex: none;
  width: 44px;
  height: 44px;
  border-radius: var(--r-sm);
  background: var(--bg-inset);
  overflow: hidden;
}

.check__art svg {
  width: 100%;
  height: 100%;
}

.check__main {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.check__name {
  font-size: var(--t-3);
  font-weight: 600;
}

.check__price {
  font-size: var(--t-2);
  color: var(--fg-2);
}

.check__btn {
  flex: none;
}

/* ── 이벤트 ──────────────────────────────────────────── */

.event {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 12px 0;
  padding: 16px;
  border-radius: var(--r-lg);
  background: var(--bg-card-2);
  border: 1px dashed var(--line);
}

.event__copy {
  flex: 1 1 auto;
}

.event__kicker {
  font-size: var(--t-1);
  font-weight: 700;
  color: var(--sale);
  letter-spacing: 0.08em;
}

.event__title {
  margin: 4px 0 6px;
  font-size: var(--t-5);
  font-weight: 800;
  line-height: 1.3;
  white-space: pre-line;
}

.event__body {
  margin-bottom: 8px;
  font-size: var(--t-2);
  color: var(--fg-2);
}

.event__art {
  flex: none;
  width: 76px;
  height: 76px;
  opacity: 0.9;
}

.event__art svg {
  width: 100%;
  height: 100%;
}

/* ── 분류·선반 ───────────────────────────────────────── */

.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 0 8px;
  font-size: var(--t-2);
}

.chip {
  flex: none;
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 0 14px;
  border-radius: var(--r-pill);
  border: 1px solid var(--line);
  background: var(--bg-card);
  color: var(--fg-2);
  font-size: var(--t-2);
  font-weight: 600;
  white-space: nowrap;
}

.chip.is-on {
  background: var(--fg);
  border-color: var(--fg);
  color: var(--bg-2);
}

.shelf {
  margin: 16px 0;
}

.shelf__head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}

.shelf__title {
  font-size: var(--t-5);
  font-weight: 800;
  letter-spacing: -0.03em;
}

.shelf__sub {
  margin-top: 2px;
  font-size: var(--t-1);
  color: var(--fg-3);
}

.shelf__more {
  flex: none;
  font-size: var(--t-2);
  color: var(--fg-3);
  min-height: 44px;
  display: flex;
  align-items: center;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.pcard {
  display: flex;
  flex-direction: column;
  border-radius: var(--r-md);
  background: var(--bg-card);
  border: 1px solid var(--line);
  overflow: hidden;
  transition: transform 140ms var(--ease), box-shadow 160ms var(--ease);
}

.pcard:active {
  transform: scale(0.99);
}

.pcard--creepy {
  border-color: var(--line);
}

.pcard__art {
  position: relative;
  aspect-ratio: 1 / 1;
  background: var(--bg-inset);
  padding: 12px;
}

html.mood-night .pcard__art {
  background: var(--bg-inset);
}

.pcard__art svg {
  width: 100%;
  height: 100%;
}

.pcard__body {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 10px 12px 14px;
}

.pcard__name {
  font-size: var(--t-3);
  font-weight: 700;
  line-height: 1.35;
  letter-spacing: -0.02em;
}

.pcard__tagline {
  font-size: var(--t-1);
  color: var(--fg-3);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pcard__rate {
  display: flex;
  align-items: center;
  gap: 4px;
}

.pcard__count {
  font-size: var(--t-1);
  color: var(--fg-3);
}

.pcard__price {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.price {
  font-size: var(--t-4);
  font-weight: 800;
  letter-spacing: -0.02em;
}

.price.is-muted {
  color: var(--fg-3);
}

/* ── 사업자 정보 ─────────────────────────────────────── */

.biz {
  margin: 24px 0 8px;
  padding: 16px;
  border-radius: var(--r-md);
  background: var(--bg-card-2);
  border: 1px solid var(--line-soft);
}

.biz__title {
  margin-bottom: 8px;
  font-size: var(--t-1);
  font-weight: 700;
  color: var(--fg-3);
}

.biz__row {
  display: flex;
  gap: 12px;
  padding: 3px 0;
  font-size: var(--t-1);
  line-height: 1.6;
}

.biz__key {
  flex: none;
  width: 92px;
  color: var(--fg-3);
}

.biz__val {
  flex: 1 1 auto;
  color: var(--fg-2);
}

.biz__more {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  font-size: var(--t-1);
  color: var(--brand);
  font-weight: 600;
}

/* ── 상품 상세 ───────────────────────────────────────── */

.crumbs {
  display: flex;
  align-items: center;
  gap: 4px;
  min-height: 44px;
  margin-bottom: 4px;
}

.crumbs__back {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  min-height: 44px;
}

.crumbs__text {
  font-size: var(--t-1);
  color: var(--fg-3);
  font-weight: 600;
  letter-spacing: 0.04em;
}

.crumbs__cart {
  margin-left: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  min-height: 44px;
}

.pdp__art {
  position: relative;
  aspect-ratio: 1 / 1;
  max-height: 340px;
  margin-bottom: 12px;
  border-radius: var(--r-lg);
  background: var(--bg-inset);
  padding: 24px;
}

.pdp__art svg {
  width: 100%;
  height: 100%;
}

.pdp__art--night {
  background: var(--bg-card-2);
}

.pdp__code {
  position: absolute;
  right: 12px;
  bottom: 12px;
  font-size: var(--t-1);
  color: var(--fg-3);
  letter-spacing: 0.04em;
}

.pdp__seller {
  font-size: var(--t-1);
  color: var(--fg-3);
}

.pdp__name {
  margin: 4px 0 6px;
  font-size: var(--t-6);
  font-weight: 800;
  line-height: 1.28;
  letter-spacing: -0.035em;
}

.pdp__tagline {
  font-size: var(--t-3);
  color: var(--fg-2);
}

.pdp__rate {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 8px 0;
}

.pdp__count {
  font-size: var(--t-1);
  color: var(--fg-3);
}

.pdp__price {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin: 4px 0;
}

.pdp__discount {
  font-size: var(--t-1);
  font-weight: 700;
  color: var(--sale);
}

.pdp__won {
  font-size: var(--t-6);
  font-weight: 800;
  letter-spacing: -0.03em;
}

.pdp__delivery {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: var(--r-md);
  background: var(--bg-card-2);
  font-size: var(--t-2);
  color: var(--fg-2);
}

.pdp__delivery .glyph {
  width: 18px;
  height: 18px;
  flex: none;
}

.pdp__warn {
  margin-top: 8px;
  padding: 10px 12px;
  border-radius: var(--r-md);
  background: var(--sale-soft);
  color: var(--sale);
  font-size: var(--t-2);
  font-weight: 600;
}

.pdp__actions {
  display: flex;
  gap: 8px;
  margin: 16px 0;
}

.pdp__actions .btn {
  flex: 1 1 0;
}

.clockbtn {
  margin-bottom: 8px;
}

.sec {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

.sec__title {
  margin-bottom: 12px;
  font-size: var(--t-5);
  font-weight: 800;
  letter-spacing: -0.03em;
}

.detail {
  margin-bottom: 12px;
}

.detail__p {
  margin-bottom: 8px;
  font-size: var(--t-3);
  color: var(--fg-2);
  line-height: 1.68;
}

.spec {
  border-top: 1px solid var(--line-soft);
}

.spec__row {
  display: flex;
  gap: 12px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line-soft);
  font-size: var(--t-2);
}

.spec__key {
  flex: none;
  width: 88px;
  color: var(--fg-3);
}

.spec__val {
  flex: 1 1 auto;
  color: var(--fg);
}

.reviews__sum {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  padding: 12px;
  border-radius: var(--r-md);
  background: var(--bg-card-2);
}

.reviews__num {
  font-size: var(--t-6);
  font-weight: 800;
  letter-spacing: -0.03em;
}

.reviews__count {
  font-size: var(--t-1);
  color: var(--fg-3);
}

.review {
  padding: 12px 0;
  border-top: 1px solid var(--line-soft);
}

.review--warn {
  margin: 8px 0;
  padding: 12px;
  border: 1px solid var(--sale);
  border-radius: var(--r-md);
  background: var(--sale-soft);
}

.review__head {
  display: flex;
  align-items: center;
  gap: 8px;
}

.review__avatar {
  flex: none;
  width: 32px;
  height: 32px;
  border-radius: var(--r-pill);
  overflow: hidden;
}

.review__avatar svg {
  width: 100%;
  height: 100%;
}

.review__who {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.review__user {
  font-size: var(--t-2);
  font-weight: 700;
}

.review__meta {
  font-size: var(--t-1);
  color: var(--fg-3);
}

.review__text {
  margin-top: 8px;
  font-size: var(--t-3);
  color: var(--fg-2);
  line-height: 1.62;
}

.review__foot {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-top: 8px;
  font-size: var(--t-1);
  color: var(--fg-3);
}

.review__flag {
  color: var(--sale);
  font-weight: 700;
}

.qa__item {
  padding: 10px 0;
  border-top: 1px solid var(--line-soft);
}

.qa__q {
  font-size: var(--t-2);
  font-weight: 700;
}

.qa__a {
  margin-top: 4px;
  font-size: var(--t-2);
  color: var(--fg-2);
}

.qa__empty,
.qa__hint {
  font-size: var(--t-2);
  color: var(--fg-3);
}

.seller {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

.seller__row {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-bottom: 4px;
}

.seller__name {
  font-size: var(--t-3);
  font-weight: 700;
}

.seller__meta {
  font-size: var(--t-1);
  color: var(--fg-3);
}

/* ── 장바구니 ────────────────────────────────────────── */

.cart {
  border-top: 1px solid var(--line);
}

.cartrow {
  display: flex;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line-soft);
}

.cartrow__art {
  flex: none;
  width: 68px;
  height: 68px;
  border-radius: var(--r-sm);
  background: var(--bg-inset);
  overflow: hidden;
}

.cartrow__art svg {
  width: 100%;
  height: 100%;
}

.cartrow__main {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.cartrow__name {
  font-size: var(--t-3);
  font-weight: 600;
}

.cartrow__meta {
  font-size: var(--t-1);
  color: var(--fg-3);
}

.cartrow__side {
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: space-between;
}

.cartrow__price {
  font-size: var(--t-3);
  font-weight: 700;
}

.cartrow__del {
  min-height: 44px;
  padding: 0 4px;
  font-size: var(--t-1);
  color: var(--fg-3);
}

.qty {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  margin-top: 2px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  width: fit-content;
}

.qty__btn {
  width: 44px;
  min-height: 44px;
  font-size: var(--t-4);
  color: var(--fg-2);
}

.qty__num {
  min-width: 24px;
  text-align: center;
  font-size: var(--t-3);
  font-weight: 700;
}

.summary {
  margin-top: 16px;
  padding: 16px;
  border-radius: var(--r-md);
  background: var(--bg-card);
  border: 1px solid var(--line);
}

.summary__row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 4px 0;
  font-size: var(--t-3);
  color: var(--fg-2);
}

.summary__row strong {
  color: var(--fg);
  font-size: var(--t-4);
}

.summary__bar {
  height: 6px;
  margin: 8px 0;
  border-radius: var(--r-pill);
  background: var(--bg-inset);
  overflow: hidden;
}

.summary__fill {
  display: block;
  height: 100%;
  background: var(--brand);
}

.warnbox {
  margin-top: 12px;
  padding: 12px 16px;
  border-radius: var(--r-md);
  background: var(--sale-soft);
  border: 1px solid var(--sale);
}

.warnbox__title {
  margin-bottom: 4px;
  font-size: var(--t-2);
  font-weight: 800;
  color: var(--sale);
}

.warnbox__line {
  font-size: var(--t-2);
  color: var(--fg-2);
}

.buybar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(56px + var(--sab));
  z-index: 44;
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: 560px;
  margin: 0 auto;
  padding: 8px 16px;
  background: var(--bg-2);
  border-top: 1px solid var(--line);
}

.buybar__sum {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
}

.buybar__label {
  font-size: var(--t-1);
  color: var(--fg-3);
}

.buybar__won {
  font-size: var(--t-5);
  font-weight: 800;
  letter-spacing: -0.02em;
}

.buybar__btn {
  flex: none;
  min-width: 132px;
}

/* ── 주문서 ──────────────────────────────────────────── */

.formbox {
  margin-bottom: 12px;
  padding: 16px;
  border-radius: var(--r-md);
  background: var(--bg-card);
  border: 1px solid var(--line);
}

.formbox__title {
  margin-bottom: 8px;
  font-size: var(--t-4);
  font-weight: 800;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 8px 0;
  border-top: 1px solid var(--line-soft);
}

.field__label {
  font-size: var(--t-1);
  color: var(--fg-3);
}

.field__static {
  font-size: var(--t-4);
}

.field__input,
.se__input,
.chatw__input,
.codebox__input {
  width: 100%;
  min-height: 48px;
  padding: 0 12px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line);
  background: var(--bg-2);
  color: var(--fg);
  font-size: var(--t-4);
  font-family: inherit;
}

.mini__row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 6px 0;
  font-size: var(--t-2);
  color: var(--fg-2);
}

.mini__name {
  flex: 1 1 auto;
}

.mini__total {
  display: flex;
  justify-content: space-between;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--line);
  font-size: var(--t-3);
}

.mini__total strong {
  font-size: var(--t-4);
}

.radio,
.agree {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 48px;
  border-top: 1px solid var(--line-soft);
  font-size: var(--t-3);
}

.radio input,
.agree input {
  width: 20px;
  height: 20px;
  accent-color: var(--brand);
}

.radio__label {
  flex: 1 1 auto;
}

/* ── 주문 완료 ───────────────────────────────────────── */

.done {
  padding-top: 24px;
}

.done__mark svg {
  width: 44px;
  height: 44px;
}

.done__title {
  margin: 8px 0 4px;
  font-size: var(--t-6);
  font-weight: 800;
  letter-spacing: -0.04em;
}

.done__sub {
  font-size: var(--t-3);
  color: var(--fg-2);
}

.receipt {
  margin: 16px 0;
  padding: 16px;
  border-radius: var(--r-md);
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-top: 4px solid var(--fg);
}

.receipt__row {
  display: flex;
  gap: 12px;
  padding: 8px 0;
  border-bottom: 1px dashed var(--line);
  font-size: var(--t-2);
}

.receipt__row:last-child {
  border-bottom: 0;
}

.receipt__row.is-bad .receipt__val {
  color: var(--sale);
  font-weight: 800;
}

.receipt__key {
  flex: none;
  width: 88px;
  color: var(--fg-3);
}

.receipt__val {
  flex: 1 1 auto;
  color: var(--fg);
  word-break: keep-all;
}

.done__warn {
  padding: 12px;
  border-radius: var(--r-md);
  background: var(--sale-soft);
  color: var(--sale);
  font-size: var(--t-2);
  line-height: 1.5;
}

/* ── 검색 ────────────────────────────────────────────── */

.se {
  min-height: 100dvh;
}

.se__head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0 12px;
}

.se__logo {
  flex: none;
  font-size: var(--t-5);
  font-weight: 800;
  letter-spacing: -0.05em;
  color: var(--se-fg);
}

.se__logo2 {
  color: var(--se-link);
}

.se__form {
  flex: 1 1 auto;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 4px 4px 12px;
  border-radius: var(--r-pill);
  border: 1px solid var(--se-line);
  background: var(--se-bg);
}

.se__input {
  flex: 1 1 auto;
  min-height: 44px;
  border: 0;
  background: transparent;
  color: var(--se-fg);
  padding: 0;
}

.se__go {
  flex: none;
  min-height: 40px;
  padding: 0 14px;
  border-radius: var(--r-pill);
  background: var(--se-link);
  color: var(--fg-inverse);
  font-size: var(--t-2);
  font-weight: 700;
}

.se__sug {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 0 12px;
}

.se__home {
  padding: 40px 0;
}

.se__hint {
  font-size: var(--t-5);
  font-weight: 700;
  color: var(--se-fg);
  letter-spacing: -0.02em;
}

.se__fine {
  margin-top: 12px;
  font-size: var(--t-1);
  color: var(--se-fg-2);
}

.se__meta {
  display: flex;
  gap: 12px;
  padding: 8px 0;
  border-bottom: 1px solid var(--se-line);
  font-size: var(--t-1);
  color: var(--se-fg-2);
}

.se__time {
  color: var(--se-fg-2);
}

.result {
  position: relative;
  padding: 12px 0;
  border-bottom: 1px solid var(--se-line);
}

.result--police {
  margin: 8px 0;
  padding: 12px;
  border: 1px solid var(--sale);
  border-radius: var(--r-md);
  background: var(--sale-soft);
}

.result__flag {
  display: inline-block;
  margin-bottom: 4px;
  padding: 2px 8px;
  border-radius: var(--r-sm);
  background: var(--sale);
  color: var(--fg-inverse);
  font-size: var(--t-1);
  font-weight: 800;
}

.result__url {
  font-size: var(--t-1);
  color: var(--se-url);
  letter-spacing: 0;
}

.result__title {
  display: block;
  min-height: 44px;
  padding: 2px 0;
  text-align: left;
  font-size: var(--t-4);
  font-weight: 600;
  color: var(--se-link);
  line-height: 1.4;
}

.result__snippet {
  font-size: var(--t-2);
  color: var(--se-fg-2);
  line-height: 1.6;
}

.ad {
  margin-top: 16px;
  padding: 12px;
  border: 1px solid var(--se-line);
  border-radius: var(--r-md);
  background: var(--se-ad);
}

.ad__label {
  font-size: var(--t-1);
  color: var(--se-fg-2);
}

.ad__title {
  margin: 4px 0;
  font-size: var(--t-4);
  font-weight: 700;
  color: var(--se-fg);
}

.ad__body {
  margin-bottom: 8px;
  font-size: var(--t-2);
  color: var(--se-fg-2);
}

/* ── 경찰청 포털 ─────────────────────────────────────── */

.gov {
  color: var(--fg);
}

.gov__top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0 -16px 12px;
  padding: 16px;
  background: var(--gov-navy);
  color: var(--fg-inverse);
}

.gov__top--slim {
  padding: 12px 16px;
}

.gov__seal {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: var(--r-pill);
  border: 1.5px solid var(--fg-inverse);
  color: var(--fg-inverse);
}

.gov__seal .glyph {
  width: 22px;
  height: 22px;
}

.gov__org {
  font-size: var(--t-4);
  font-weight: 800;
  letter-spacing: -0.02em;
}

.gov__sub {
  font-size: var(--t-1);
  opacity: 0.75;
}

.gov__crumb {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
  font-size: var(--t-1);
  color: var(--gov-fg-2);
}

.gov__sep {
  opacity: 0.5;
}

.gov__body {
  margin-bottom: 12px;
  font-size: var(--t-3);
  color: var(--fg-2);
  line-height: 1.6;
}

.gov__fine {
  margin-top: 12px;
  font-size: var(--t-1);
  color: var(--fg-3);
  line-height: 1.5;
}

.case {
  position: relative;
  padding: 16px;
  border: 1px solid var(--gov-line);
  border-left: 4px solid var(--gov-navy);
  border-radius: var(--r-sm);
  background: var(--bg-card);
}

.case__stamp {
  position: absolute;
  top: 16px;
  right: 16px;
  padding: 4px 8px;
  border: 2px solid var(--gov-red);
  border-radius: var(--r-sm);
  color: var(--gov-red);
  font-size: var(--t-1);
  font-weight: 800;
  transform: rotate(-6deg);
  letter-spacing: 0.06em;
}

.case__no {
  font-size: var(--t-1);
  color: var(--fg-3);
  letter-spacing: 0.04em;
}

.case__title {
  margin: 4px 0 4px;
  padding-right: 72px;
  font-size: var(--t-5);
  font-weight: 800;
  line-height: 1.3;
  letter-spacing: -0.02em;
}

.case__meta {
  font-size: var(--t-1);
  color: var(--fg-3);
  margin-bottom: 8px;
}

.case__summary {
  font-size: var(--t-2);
  color: var(--fg-2);
  line-height: 1.65;
}

.govsec {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--gov-line);
}

.govsec__title {
  margin-bottom: 8px;
  font-size: var(--t-4);
  font-weight: 800;
  padding-left: 8px;
  border-left: 3px solid var(--gov-navy);
  line-height: 1.2;
}

.govsec__body {
  margin-bottom: 8px;
  font-size: var(--t-2);
  color: var(--fg-2);
  line-height: 1.6;
}

.govsec--cta {
  padding: 16px;
  border: 1px solid var(--gov-line);
  border-radius: var(--r-sm);
  background: var(--bg-card-2);
}

.govsec--ok {
  padding: 16px;
  border: 1px solid var(--ok);
  border-radius: var(--r-sm);
  background: var(--ok-soft);
}

.victim {
  display: flex;
  gap: 12px;
  padding: 12px;
  margin-bottom: 8px;
  border: 1px solid var(--gov-line);
  border-radius: var(--r-sm);
  background: var(--bg-card);
}

.victim__photo {
  flex: none;
  width: 78px;
  height: 88px;
  background: var(--bg-inset);
  border: 1px solid var(--gov-line);
}

.victim__photo svg {
  width: 100%;
  height: 100%;
}

.victim__body {
  flex: 1 1 auto;
}

.victim__name {
  font-size: var(--t-4);
  font-weight: 800;
}

.victim__meta {
  font-size: var(--t-1);
  color: var(--fg-3);
}

.victim__note {
  margin-top: 4px;
  font-size: var(--t-2);
  color: var(--fg-2);
  line-height: 1.5;
}

.facts__row {
  display: flex;
  gap: 12px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line-soft);
  font-size: var(--t-2);
}

.facts__row.is-key {
  background: var(--sale-soft);
  padding: 8px;
  border-radius: var(--r-sm);
  border-bottom: 0;
  margin-bottom: 4px;
}

.facts__key {
  flex: none;
  width: 84px;
  color: var(--fg-3);
  font-weight: 600;
}

.facts__val {
  flex: 1 1 auto;
  color: var(--fg);
}

.evidence {
  display: flex;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line-soft);
}

.evidence__dot {
  flex: none;
  width: 6px;
  height: 6px;
  margin-top: 8px;
  border-radius: var(--r-pill);
  background: var(--gov-navy);
}

.evidence__name {
  font-size: var(--t-2);
  font-weight: 700;
}

.evidence__note {
  font-size: var(--t-1);
  color: var(--fg-3);
}

.govad {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 16px;
  padding: 12px;
  border: 1px solid var(--gov-line);
  border-radius: var(--r-sm);
  background: var(--bg-card-2);
}

.govad__body {
  flex: 1 1 auto;
}

.govad__label {
  font-size: var(--t-1);
  color: var(--fg-3);
}

.govad__title {
  margin: 2px 0;
  font-size: var(--t-3);
  font-weight: 800;
}

.govad__text {
  font-size: var(--t-1);
  color: var(--fg-2);
  line-height: 1.5;
}

.govad__note {
  margin-top: 4px;
  font-size: var(--t-1);
  color: var(--fg-3);
}

/* ── 증거 대조 ───────────────────────────────────────── */

.matchhead {
  margin-bottom: 12px;
}

.matchhead__count {
  font-size: var(--t-3);
  font-weight: 800;
  margin-bottom: 4px;
}

.matchhead__bar {
  height: 8px;
  border-radius: var(--r-pill);
  background: var(--bg-inset);
  overflow: hidden;
}

.matchhead__fill {
  display: block;
  height: 100%;
  background: var(--gov-navy);
  transition: width 220ms var(--ease);
}

.slot {
  margin-bottom: 12px;
  padding: 12px;
  border: 1px solid var(--gov-line);
  border-radius: var(--r-sm);
  background: var(--bg-card);
}

.slot.is-done {
  border-color: var(--ok);
  background: var(--ok-soft);
}

.slot__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.slot__field {
  font-size: var(--t-2);
  font-weight: 800;
  color: var(--gov-navy);
}

.slot__ok {
  padding: 2px 8px;
  border: 1px solid var(--ok);
  border-radius: var(--r-sm);
  color: var(--ok);
  font-size: var(--t-1);
  font-weight: 800;
}

.slot__need {
  font-size: var(--t-1);
  color: var(--fg-3);
}

.slot__q {
  margin: 4px 0 8px;
  font-size: var(--t-2);
  color: var(--fg-2);
}

.cands {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.cand {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 56px;
  padding: 6px 8px;
  border: 1px solid var(--gov-line);
  border-radius: var(--r-sm);
  background: var(--bg-card);
  text-align: left;
}

.cand.is-picked {
  border-color: var(--gov-navy);
  box-shadow: 0 0 0 1px var(--gov-navy) inset;
}

.cand.is-dim {
  opacity: 0.4;
}

.cand__art {
  flex: none;
  width: 40px;
  height: 40px;
  border-radius: var(--r-sm);
  background: var(--bg-inset);
  overflow: hidden;
}

.cand__art svg {
  width: 100%;
  height: 100%;
}

.cand__name {
  font-size: var(--t-1);
  font-weight: 600;
  line-height: 1.3;
}

.matchact {
  display: flex;
  gap: 8px;
  margin-top: 16px;
}

.matchact .btn {
  flex: 1 1 0;
}

/* ── 메신저 ──────────────────────────────────────────── */

.chatw {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 60;
  display: flex;
  flex-direction: column;
  max-height: 72dvh;
  padding-bottom: var(--sab);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  background: var(--bg-card);
  border-top: 1px solid var(--line);
  box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.22);
  animation: sheetin 240ms var(--ease) 1;
}

.chatw__bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
}

.chatw__dot {
  width: 8px;
  height: 8px;
  border-radius: var(--r-pill);
  background: var(--ok);
}

.chatw__who {
  font-size: var(--t-3);
  font-weight: 800;
}

.chatw__stat {
  margin-left: auto;
  font-size: var(--t-1);
  color: var(--fg-3);
}

.chatw__close {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  min-height: 44px;
  color: var(--fg-3);
}

.chatw__tabs {
  display: flex;
  gap: 4px;
  padding: 4px 12px;
  border-bottom: 1px solid var(--line-soft);
}

.chatw__tab {
  min-height: 44px;
  padding: 0 12px;
  font-size: var(--t-2);
  font-weight: 700;
  color: var(--fg-3);
  border-bottom: 2px solid transparent;
}

.chatw__tab.is-on {
  color: var(--fg);
  border-bottom-color: var(--brand);
}

.chatw__body {
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.chatw__log {
  max-height: 40dvh;
  overflow-y: auto;
  padding: 12px;
  background: var(--bg-inset);
}

.msg {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  margin-bottom: 8px;
}

.msg--me {
  flex-direction: row-reverse;
}

.msg__avatar {
  flex: none;
  width: 28px;
  height: 28px;
  border-radius: var(--r-pill);
  overflow: hidden;
}

.msg__avatar svg {
  width: 100%;
  height: 100%;
}

.msg__bubble {
  max-width: 76%;
  padding: 8px 12px;
  border-radius: var(--r-md);
  background: var(--bg-card);
  border: 1px solid var(--line);
}

.msg--me .msg__bubble {
  background: var(--brand);
  border-color: var(--brand);
  color: var(--fg-inverse);
}

.msg__text {
  font-size: var(--t-3);
  line-height: 1.5;
  white-space: pre-line;
  word-break: keep-all;
}

.typing {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 0;
  color: var(--fg-3);
}

.typing__dot {
  width: 6px;
  height: 6px;
  border-radius: var(--r-pill);
  background: var(--fg-3);
  animation: pulse-dot 1.2s infinite;
}

.typing__dot:nth-child(2) { animation-delay: 160ms; }
.typing__dot:nth-child(3) { animation-delay: 320ms; }

.typing__text {
  margin-left: 4px;
  font-size: var(--t-1);
}

.quick {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 8px 12px;
}

.chatw__foot,
.chatpage__foot {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 8px;
  border-top: 1px solid var(--line);
}

.chatw__input {
  flex: 1 1 auto;
  min-height: 44px;
  border-radius: var(--r-pill);
}

.chatw__send {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  min-height: 44px;
  border-radius: var(--r-pill);
  background: var(--brand);
  color: var(--fg-inverse);
}

// 소곤마켓 — 소리. 오디오 파일 없이 Web Audio API 합성으로만 만든다.
// 낮의 쇼핑몰 → 밤의 가게 → 복도의 추격까지 층을 갈아 끼운다.

const MUTE_KEY = "sogon.full.muted";

function createAudio() {
  let ctx = null;
  let master = null;
  let bed = null; // 지속음(환경)
  let bedFilter = null;
  let staticNode = null;
  let staticGain = null;
  let heartTimer = 0;
  let heartRate = 0;
  let muted = false;
  let noiseBuf = null;

  try {
    muted = window.localStorage.getItem(MUTE_KEY) === "1";
  } catch (grr) {
    muted = false;
  }

  function now() {
    return ctx ? ctx.currentTime : 0;
  }

  function ensure() {
    if (ctx) {
      if (ctx.state === "suspended") ctx.resume();
      return ctx;
    }
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    try {
      ctx = new Ctor();
    } catch (grr) {
      return null;
    }
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18;
    comp.ratio.value = 8;
    comp.connect(ctx.destination);
    master = ctx.createGain();
    master.gain.value = muted ? 0 : 0.7;
    master.connect(comp);
    buildBed();
    return ctx;
  }

  function makeNoise(seconds) {
    if (noiseBuf && noiseBuf.length > (ctx.sampleRate * seconds)) return noiseBuf;
    const frames = Math.max(1, Math.floor(ctx.sampleRate * (seconds || 2)));
    const buffer = ctx.createBuffer(1, frames, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    let last = 0;
    for (let i = 0; i < frames; i += 1) {
      const white = Math.random() * 2 - 1;
      last = (last + 0.02 * white) / 1.02;
      data[i] = white * 0.6 + last * 2.2;
    }
    noiseBuf = buffer;
    return buffer;
  }

  function gain(value, target) {
    const g = ctx.createGain();
    g.gain.value = value;
    g.connect(target || master);
    return g;
  }

  function panner(pan) {
    if (!ctx.createStereoPanner) return null;
    const p = ctx.createStereoPanner();
    p.pan.value = Math.max(-1, Math.min(1, pan || 0));
    return p;
  }

  function route(node, pan, level) {
    const p = panner(pan);
    const g = gain(level === undefined ? 1 : level);
    if (p) {
      node.connect(p);
      p.connect(g);
    } else {
      node.connect(g);
    }
    return g;
  }

  function tone(freq, start, dur, type, level, pan) {
    if (!ctx) return;
    const osc = ctx.createOscillator();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, start);
    const g = gain(0.0001);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, level), start + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    const p = panner(pan);
    if (p) {
      osc.connect(p);
      p.connect(g);
    } else {
      osc.connect(g);
    }
    osc.start(start);
    osc.stop(start + dur + 0.03);
  }

  function noise(start, dur, level, filterFreq, q, pan, type) {
    if (!ctx) return;
    const src = ctx.createBufferSource();
    src.buffer = makeNoise(Math.min(3, dur + 0.2));
    src.loop = true;
    const filter = ctx.createBiquadFilter();
    filter.type = type || "bandpass";
    filter.frequency.value = filterFreq || 900;
    filter.Q.value = q || 0.8;
    const g = gain(0.0001);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, level), start + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    const p = panner(pan);
    src.connect(filter);
    if (p) {
      filter.connect(p);
      p.connect(g);
    } else {
      filter.connect(g);
    }
    src.start(start);
    src.stop(start + dur + 0.05);
  }

  function buildBed() {
    if (!ctx || bed) return;
    bed = ctx.createGain();
    bed.gain.value = 0.0001;
    bed.connect(master);

    const hum = ctx.createOscillator();
    hum.type = "sawtooth";
    hum.frequency.value = 54;
    const hum2 = ctx.createOscillator();
    hum2.type = "sine";
    hum2.frequency.value = 54.7;
    bedFilter = ctx.createBiquadFilter();
    bedFilter.type = "lowpass";
    bedFilter.frequency.value = 220;
    bedFilter.Q.value = 3;
    hum.connect(bedFilter);
    hum2.connect(bedFilter);
    bedFilter.connect(bed);

    const air = ctx.createBufferSource();
    air.buffer = makeNoise(3);
    air.loop = true;
    const airFilter = ctx.createBiquadFilter();
    airFilter.type = "bandpass";
    airFilter.frequency.value = 420;
    airFilter.Q.value = 0.6;
    const airGain = ctx.createGain();
    airGain.gain.value = 0.35;
    air.connect(airFilter);
    airFilter.connect(airGain);
    airGain.connect(bed);

    hum.start();
    hum2.start();
    air.start();

    const lfo = ctx.createOscillator();
    lfo.type = "sine";
    lfo.frequency.value = 0.06;
    const lg = ctx.createGain();
    lg.gain.value = 0.012;
    lfo.connect(lg);
    lg.connect(bed.gain);
    lfo.start();

    bed.gain.exponentialRampToValueAtTime(0.05, now() + 3);
    bedFilter.frequency.setTargetAtTime(220, now(), 1);
  }

  function mood(kind) {
    if (!ensure() || !bedFilter) return;
    const t = now();
    if (kind === "chase") {
      bedFilter.frequency.setTargetAtTime(120, t, 0.6);
      bed.gain.setTargetAtTime(0.09, t, 0.6);
      startStatic(0.02);
    } else if (kind === "night") {
      bedFilter.frequency.setTargetAtTime(160, t, 1.2);
      bed.gain.setTargetAtTime(0.06, t, 1.2);
      stopStatic();
    } else {
      bedFilter.frequency.setTargetAtTime(300, t, 1.2);
      bed.gain.setTargetAtTime(0.025, t, 1.2);
      stopStatic();
    }
  }

  function click() {
    if (!ensure()) return;
    const t = now();
    tone(640, t, 0.04, "square", 0.02);
    tone(920, t + 0.008, 0.03, "sine", 0.014);
  }

  function type() {
    if (!ensure()) return;
    const t = now();
    noise(t, 0.03, 0.014, 2600, 1.4, 0.1);
  }

  function pop() {
    if (!ensure()) return;
    const t = now();
    tone(760, t, 0.09, "sine", 0.05);
    tone(1015, t + 0.07, 0.16, "sine", 0.04);
  }

  function error() {
    if (!ensure()) return;
    const t = now();
    tone(220, t, 0.12, "square", 0.05);
    tone(180, t + 0.14, 0.16, "square", 0.045);
  }

  function beep() {
    if (!ensure()) return;
    const t = now();
    tone(1400, t, 0.05, "square", 0.03);
    tone(1400, t + 0.12, 0.05, "square", 0.03);
  }

  function glitch() {
    if (!ensure()) return;
    const t = now();
    noise(t, 0.14, 0.1, 1600, 0.9, -0.2);
    noise(t + 0.05, 0.08, 0.06, 320, 0.7, 0.3);
    tone(88, t, 0.18, "sawtooth", 0.035);
  }

  function stinger() {
    if (!ensure()) return;
    const t = now();
    tone(1568, t, 0.5, "sawtooth", 0.03, -0.3);
    tone(1480, t + 0.02, 0.5, "sawtooth", 0.025, 0.3);
    tone(49, t, 0.9, "sine", 0.09);
    noise(t, 0.3, 0.06, 2400, 0.7);
  }

  function knock(times) {
    if (!ensure()) return;
    const t = now();
    const n = times || 3;
    for (let i = 0; i < n; i += 1) {
      const at = t + i * 0.26;
      tone(64, at, 0.16, "sine", 0.12, -0.1);
      noise(at, 0.05, 0.05, 380, 1.2, -0.1, "lowpass");
      tone(120, at + 0.01, 0.05, "triangle", 0.03);
    }
  }

  function rattle() {
    if (!ensure()) return;
    const t = now();
    for (let i = 0; i < 5; i += 1) {
      const at = t + i * 0.055 + Math.random() * 0.02;
      tone(2100 + Math.random() * 800, at, 0.045, "square", 0.018, -0.4);
      noise(at, 0.04, 0.02, 3200, 2);
    }
    tone(180, t, 0.18, "triangle", 0.03);
  }

  function lockError() {
    if (!ensure()) return;
    const t = now();
    tone(880, t, 0.07, "square", 0.04);
    tone(660, t + 0.1, 0.1, "square", 0.04);
    tone(440, t + 0.22, 0.22, "square", 0.04);
  }

  function steps(count, level, pan) {
    if (!ensure()) return;
    const t = now();
    const n = count || 2;
    for (let i = 0; i < n; i += 1) {
      const at = t + i * 0.42;
      tone(58, at, 0.14, "sine", level || 0.05, (pan || 0) * (i / n));
      noise(at, 0.09, (level || 0.05) * 0.8, 240, 1.4, (pan || 0) * (i / n), "lowpass");
    }
  }

  function whisper() {
    if (!ensure()) return;
    const t = now();
    noise(t, 1.2, 0.035, 1800, 3, -0.5);
    noise(t + 0.3, 1.1, 0.025, 1100, 3.5, 0.5);
    tone(310, t + 0.2, 0.9, "sine", 0.008, 0.2);
  }

  function startStatic(level) {
    if (!ensure()) return;
    if (staticNode) {
      if (staticGain) staticGain.gain.setTargetAtTime(level || 0.02, now(), 0.4);
      return;
    }
    staticNode = ctx.createBufferSource();
    staticNode.buffer = makeNoise(2);
    staticNode.loop = true;
    const f = ctx.createBiquadFilter();
    f.type = "bandpass";
    f.frequency.value = 2600;
    f.Q.value = 0.4;
    staticGain = ctx.createGain();
    staticGain.gain.value = 0.0001;
    staticGain.gain.exponentialRampToValueAtTime(level || 0.02, now() + 0.8);
    staticNode.connect(f);
    f.connect(staticGain);
    staticGain.connect(master);
    staticNode.start();
  }

  function stopStatic() {
    if (!staticNode || !staticGain) return;
    staticGain.gain.setTargetAtTime(0.0001, now(), 0.4);
    const node = staticNode;
    staticNode = null;
    window.setTimeout(function () {
      try {
        node.stop();
      } catch (grr) {
        /* 이미 멈췄다 */
      }
    }, 1200);
  }

  function heartOnce(level, pan) {
    if (!ctx) return;
    const t = now() + 0.02;
    tone(54, t, 0.13, "sine", level, pan);
    tone(46, t + 0.015, 0.16, "triangle", level * 0.7, pan);
    tone(58, t + 0.22, 0.11, "sine", level * 0.6, pan);
  }

  function startHeart(bpm) {
    if (!ensure()) return;
    heartRate = bpm || 66;
    if (heartTimer) return;
    heartOnce(0.1, 0);
    heartTimer = window.setInterval(function () {
      heartOnce(0.07 + Math.min(0.09, (heartRate - 60) / 500), 0);
    }, Math.max(320, Math.round(60000 / heartRate)));
  }

  function setHeart(bpm) {
    if (!ctx) return;
    const next = Math.max(40, Math.min(160, bpm || 66));
    if (Math.abs(next - heartRate) < 4) return;
    heartRate = next;
    if (heartTimer) {
      window.clearInterval(heartTimer);
      heartTimer = 0;
      startHeart(heartRate);
    }
  }

  function stopHeart() {
    if (heartTimer) window.clearInterval(heartTimer);
    heartTimer = 0;
  }

  function doorbell() {
    if (!ensure()) return;
    const t = now();
    tone(659, t, 0.5, "sine", 0.07);
    tone(523, t + 0.28, 0.7, "sine", 0.06);
  }

  function lullaby() {
    if (!ensure()) return;
    const t = now() + 0.15;
    const notes = [261.63, 293.66, 329.63, 349.23, 392.0];
    const seq = [0, 2, 3, 2, 0, 1, 0, 3, 4, 3, 2, 0, 1, 0, 2, 0];
    const lens = [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 1, 0.5, 0.5, 0.5, 0.5, 1, 0.5, 0.5, 0.5, 1.5];
    let cursor = 0;
    for (let i = 0; i < seq.length; i += 1) {
      const f = notes[seq[i]] / 2;
      tone(f, t + cursor, lens[i] * 0.95, "triangle", 0.045);
      tone(f * 2, t + cursor, lens[i] * 0.6, "sine", 0.012);
      cursor += lens[i];
    }
  }

  function ending(kind) {
    if (!ensure()) return;
    stopHeart();
    stopStatic();
    const t = now();
    if (kind === "true") {
      const chord = [261.63, 329.63, 392.0, 523.25];
      for (let i = 0; i < chord.length; i += 1) {
        tone(chord[i], t + i * 0.18, 3.2, "sine", 0.05);
        tone(chord[i] * 2, t + i * 0.18, 2.4, "sine", 0.018);
      }
      tone(130.81, t, 4, "triangle", 0.035);
    } else if (kind === "normal") {
      tone(196, t, 1.6, "sine", 0.05);
      tone(293.66, t + 0.3, 1.8, "sine", 0.035);
      tone(349.23, t + 0.9, 2.2, "sine", 0.03);
    } else {
      tone(110, t, 2.4, "sawtooth", 0.045);
      tone(82.41, t + 0.4, 2.8, "sine", 0.05);
      noise(t, 0.5, 0.05, 220, 0.7);
      tone(55, t + 0.9, 3, "triangle", 0.04);
    }
  }

  function setMuted(next) {
    muted = next;
    try {
      window.localStorage.setItem(MUTE_KEY, next ? "1" : "0");
    } catch (grr) {
      /* 저장할 수 없어도 소리는 유지한다 */
    }
    if (master && ctx) {
      master.gain.cancelScheduledValues(now());
      master.gain.setTargetAtTime(next ? 0 : 0.7, now(), 0.05);
    }
    return muted;
  }

  function isMuted() {
    return muted;
  }

  return {
    ensure: ensure,
    mood: mood,
    click: click,
    type: type,
    pop: pop,
    error: error,
    beep: beep,
    glitch: glitch,
    stinger: stinger,
    knock: knock,
    rattle: rattle,
    lockError: lockError,
    steps: steps,
    whisper: whisper,
    startStatic: startStatic,
    stopStatic: stopStatic,
    startHeart: startHeart,
    setHeart: setHeart,
    stopHeart: stopHeart,
    doorbell: doorbell,
    lullaby: lullaby,
    ending: ending,
    setMuted: setMuted,
    isMuted: isMuted,
  };
}

function h(tag, props) {
  const node = document.createElement(tag);
  if (props) {
    const keys = Object.keys(props);
    for (let i = 0; i < keys.length; i += 1) {
      const key = keys[i];
      const value = props[key];
      if (value === null || value === undefined || value === false) continue;
      if (key === "class") node.className = value;
      else if (key === "text") node.textContent = value;
      else if (key === "on") {
        const events = Object.keys(value);
        for (let j = 0; j < events.length; j += 1) {
          node.addEventListener(events[j], value[events[j]]);
        }
      } else if (key === "value") node.value = value;
      else node.setAttribute(key, value === true ? "" : value);
    }
  }
  for (let i = 2; i < arguments.length; i += 1) addChild(node, arguments[i]);
  return node;
}

function addChild(node, child) {
  if (child === null || child === undefined || child === false) return;
  if (Array.isArray(child)) {
    for (let i = 0; i < child.length; i += 1) addChild(node, child[i]);
    return;
  }
  if (typeof child === "string" || typeof child === "number") {
    node.appendChild(document.createTextNode(String(child)));
    return;
  }
  node.appendChild(child);
}

function svgIcon(paths, cls) {
  const s = document.createElementNS(SVGNS, "svg");
  s.setAttribute("viewBox", "0 0 24 24");
  s.setAttribute("aria-hidden", "true");
  s.setAttribute("class", cls || "glyph");
  for (let i = 0; i < paths.length; i += 1) {
    const p = document.createElementNS(SVGNS, "path");
    p.setAttribute("d", paths[i]);
    s.appendChild(p);
  }
  return s;
}

function parseHash() {
  const raw = String(location.hash || "").replace(/^#\/?/, "");
  const qIndex = raw.indexOf("?");
  const pathPart = qIndex === -1 ? raw : raw.slice(0, qIndex);
  const queryPart = qIndex === -1 ? "" : raw.slice(qIndex + 1);
  const parts = pathPart.split("/").filter(Boolean);
  const q = {};
  if (queryPart) {
    const pairs = queryPart.split("&");
    for (let i = 0; i < pairs.length; i += 1) {
      const eq = pairs[i].indexOf("=");
      const k = eq === -1 ? pairs[i] : pairs[i].slice(0, eq);
      const v = eq === -1 ? "" : pairs[i].slice(eq + 1);
      try {
        q[decodeURIComponent(k)] = decodeURIComponent(v.replace(/\+/g, " "));
      } catch (err) {
        q[k] = v;
      }
    }
  }
  return { name: parts[0] || "home", id: parts[1] || "", q: q };
}

  document.body.appendChild(node);
  window.clearTimeout(toastTimer);

}

function grant(id) {
  if (E.addClue(game, id)) {
    const clue = clueById(id);
    save();
    audio.pop();
    toast("수첩에 적었습니다 — " + (clue ? clue.title : "단서"));
    return true;
  }
  return false;
}

function startGame() {
  game.started = true;
  game.phase = game.phase || "mall";
  save();
  audio.ensure();
  audio.mood(game.phase === "night" ? "night" : "mall");
  chatThread = "mom";
  chatOpen = true;
  go("#/");
  render();
  window.setTimeout(function () {
    toast("엄마: 방범용품 좀 사둬라. 12만 원까지.");
    audio.pop();
  }, 700);
}

function checkTimed() {
  if (!game.started || game.ended || game.phase === "chase") return;
  if (game.t >= 213) {
    endGame(E.resolveEnding(game));
    return;
  }
  if (game.phase === "night" && game.t >= 183 && !game.securitySeen && !securityShown) {
    securityShown = true;
    window.setTimeout(function () {
      openSecurityModal("점검");
    }, 500);
  }
  if (game.t >= 205 && !warned) {
    warned = true;
    toast("마감까지 " + E.minutesLeft(game) + "분. 새벽 세 시 삼십삼 분에 문을 닫습니다.");
    audio.beep();
  }
}

function endGame(id) {
  if (game.ended) return;
  sQueue = [];
  const staleToast = document.querySelector(".toast");
  if (staleToast) staleToast.remove();
  E.finish(game, id);
  if (codex.indexOf(id) === -1) codex.push(id);
  saveCodex();
  save();
  stopChase();
  const def = ENDINGS[id];
  audio.ending(def && def.kind === "true" ? "true" : def && def.kind === "normal" ? "normal" : "bad");
  audio.stopHeart();
  chatOpen = false;
  paintChat();
  go("#/ending/" + id);
  render();
}

function unlockLetter(id) {
  const idx = E.revealIndex(id);
  if (idx < 0) return "";
  return E.SECRET_CODE.charAt(idx);
}

function sActive(item) {
  const c = game.chase;
  if (item.when === "night") return game.ordered;
  if (item.when === "nightItem") return !!game.seen.itemBat;
  if (item.when === "police") return !!game.seen.police;
  if (item.when === "matched") return E.allMatched(game);
  if (item.when === "report") return game.report === "police";
  if (item.when === "chase") return !!c && c.step === 0;
  if (item.when === "chase2") return !!c && c.step === 1;
  if (item.when === "chase3") return !!c && c.step === 2;
  if (item.when === "chase4") return !!c && c.step >= 3;
  if (item.when === "closing") return game.ended === "closing";
  return false;
}

function pumpS() {
  if (!game.started || game.ended) return;
  for (let i = 0; i < S_SCRIPT.length; i += 1) {
    const item = S_SCRIPT[i];
    if (!sActive(item)) continue;
    if (game.chatSeen.indexOf(item.id) !== -1) continue;
    if (sQueue.indexOf(item.id) !== -1) continue;
    sQueue.push(item.id);
    sBadge = true;
    window.setTimeout(function () {
      if (game.chatSeen.indexOf(item.id) === -1) game.chatSeen.push(item.id);
      sQueue = sQueue.filter(function (x) {
        return x !== item.id;
      });
      save();
      audio.pop();
      if (chatOpen) {
        paintChat();
        renderChatPage();
      } else {
        toast("S: " + item.text);
      }
      paintDock();
      if (game.chase) paintChat();
      pumpS();
    }, 1100 + i * 40);
    return;
  }
}

function sMessages() {
  const out = [];
  for (let i = 0; i < S_SCRIPT.length; i += 1) {
    if (game.chatSeen.indexOf(S_SCRIPT[i].id) !== -1) out.push({ from: "s", text: S_SCRIPT[i].text });
  }
  for (let k = 0; k < game.chatLog.length; k += 1) out.push(game.chatLog[k]);
  return out;
}

function momMessages() {
  const out = FAMILY_CHAT.map(function (m) {
    return { from: m.from === "나" ? "me" : m.from, text: m.text };
  });
  if (game.paid) {
    out.push({
      from: "엄마",
      text: "근데 주문서에 받는 사람이 왜 '정미숙'이라고 떠? 그 이름, 우리 집에서는 쓰면 안 되는 이름인데.",
    });
  }
  return out;
}

function sendChat(text) {
  const value = String(text || "").trim();
  if (!value) return;
  game.chatLog.push({ from: "me", text: value });
  audio.type();
  let reply = "";
  for (let i = 0; i < S_KEYWORD_REPLIES.length; i += 1) {
    const row = S_KEYWORD_REPLIES[i];
    for (let j = 0; j < row.keys.length; j += 1) {
      if (value.indexOf(row.keys[j]) !== -1) {
        reply = row.text;
        break;
      }
    }
    if (reply) break;
  }
  if (!reply) reply = "지금은 답장을 쓰기 어려워요. 문 쪽을 보고 있어요.";
  save();
  paintChat();
  renderChatPage();
  window.setTimeout(function () {
    game.chatLog.push({ from: "s", text: reply });
    save();
    audio.pop();
    paintChat();
    renderChatPage();
  }, 900);
}

function sendQuick(q) {
  game.chatLog.push({ from: "me", text: q.label });
  save();
  paintChat();
  renderChatPage();
  window.setTimeout(function () {
    game.chatLog.push({ from: "s", text: q.reply });
    save();
    audio.pop();
    paintChat();
    renderChatPage();
  }, 800);
}

function moodFor(route) {
  if (route.name === "police" || route.name === "match") return "world-gov";
  if (route.name === "search") return "world-se";
  if (route.name === "chase" || route.name === "ending") return "mood-night";
  return game.phase === "night" ? "mood-night" : "mood-mall";
}

function siteOf(route) {
  if (route.name === "police" || route.name === "match") return "police";
  if (route.name === "search") return "search";
  return "mall";
}

function addressFor(route) {
  if (route.name === "police") return "police.go.kr/seongdong/case/1998-1224-0333";
  if (route.name === "match") return "police.go.kr/seongdong/case/1998-1224-0333/evidence";
  if (route.name === "search") return "find.example/search?q=" + (route.q.q || "");
  if (route.name === "item") return "sogon.market/item/" + (route.id || "");
  if (route.name === "cart") return "sogon.market/cart";
  if (route.name === "order") return "sogon.market/order";
  if (route.name === "done") return "sogon.market/order/complete";
  if (route.name === "chat") return "talk.example/s/" + (chatThread === "s" ? "s" : "mom");
  return "sogon.market/";
}

function paintChrome(route) {
  if (!chromeEl) return;
  if (!route) route = parseHash();
  const hidden = route.name === "chase" || route.name === "ending" || !game.started;
  chromeEl.className = "chrome" + (hidden ? " is-hidden" : "");
  chromeEl.replaceChildren();
  if (hidden) return;
  const site = siteOf(route);
  const tabs = h("div", { class: "chrome__tabs", role: "tablist", "aria-label": "브라우저 탭" });
  const tabDefs = [
    { id: "mall", label: "소곤마켓", href: "#/" },
    { id: "search", label: "찾아요", href: "#/search" },
  ];
  if (game.seen.police || site === "police") tabDefs.push({ id: "police", label: "경찰청", href: "#/police" });
  for (let i = 0; i < tabDefs.length; i += 1) {
    const t = tabDefs[i];
    const tab = h("a", {
      class: "chrome__tab" + (site === t.id ? " is-on" : ""),
      href: t.href,
      role: "tab",
      "aria-selected": site === t.id ? "true" : "false",
    });
    tab.appendChild(h("span", { class: "chrome__favicon", "aria-hidden": "true" }));
    tab.appendChild(h("span", { class: "chrome__label", text: t.label }));
    tabs.appendChild(tab);
  }
  chromeEl.appendChild(tabs);
  const bar = h("div", { class: "chrome__bar" });
  bar.appendChild(
    h("button", {
      class: "chrome__icon",
      type: "button",
      "aria-label": "뒤로",
      on: { click: function () { audio.click(); if (history && history.back) history.back(); } },
    }, icon("back"))
  );
  const url = h("div", { class: "chrome__url" });
  url.appendChild(h("span", { class: "chrome__lock", "aria-hidden": "true" }, lockGlyph()));
  url.appendChild(h("span", { class: "chrome__text", text: addressFor(route) }));
  bar.appendChild(url);
  bar.appendChild(h("span", { class: "chrome__clock", id: "clock", text: E.formatClock(game.t) }));
  bar.appendChild(
    h("button", {
      class: "chrome__icon",
      type: "button",
      "aria-label": "새로 고침",
      on: { click: function () { audio.click(); render(); } },
    }, icon("reload"))
  );
  bar.appendChild(
    h("button", {
      class: "chrome__icon",
      type: "button",
      "aria-label": "메뉴",
      on: { click: function () { audio.click(); go("#/settings"); } },
    }, icon("menu"))
  );
  chromeEl.appendChild(bar);
}

function paintDock(route) {
  if (!dockEl) return;
  if (!route) route = parseHash();
  const hidden = route.name === "chase" || route.name === "ending" || !game.started;
  dockEl.className = "dock" + (hidden ? " is-hidden" : "");
  dockEl.replaceChildren();
  if (hidden) return;
  const items = [
    { id: "mall", label: "쇼핑", ic: "home", href: "#/", on: route.name === "home" || route.name === "item" || route.name === "cart" || route.name === "list" || route.name === "order" || route.name === "done" },
    { id: "search", label: "검색", ic: "search", href: "#/search", on: route.name === "search" },
    { id: "chat", label: "S", ic: "chat", href: "#/chat", on: route.name === "chat", badge: sBadge || sQueue.length > 0 },
    { id: "clues", label: "수첩", ic: "note", href: "#/clues", on: route.name === "clues" },
    { id: "endings", label: "도감", ic: "grid", href: "#/endings", on: route.name === "endings" || route.name === "vault" },
  ];
  const inner = h("div", { class: "dock__inner" });
  for (let i = 0; i < items.length; i += 1) {
    const it = items[i];
    const a = h("a", {
      class: "dock__item" + (it.on ? " is-on" : ""),
      href: it.href,
      "aria-current": it.on ? "page" : null,
      on: {
        click: function () {
          audio.click();
          if (it.id === "chat") {
            chatOpen = false;
            sBadge = false;
            paintChat();
          }
        },
      },
    });
    a.appendChild(icon(it.ic, "dock__glyph"));
    a.appendChild(h("span", { class: "dock__label", text: it.label }));
    if (it.badge) a.appendChild(h("span", { class: "dock__badge", "aria-hidden": "true" }));
    inner.appendChild(a);
  }
  if (audio.isMuted()) {
    const m = h("button", {
      class: "dock__mute",
      type: "button",
      "aria-label": "소리 켜기",
      on: {
        click: function () {
          audio.setMuted(false);
          audio.click();
          paintDock(route);
        },
      },
    }, icon("mute"));
    inner.appendChild(m);
  }
  dockEl.appendChild(inner);
}

function render() {
  const route = parseHash();
  const mood = moodFor(route);
  if (document.documentElement) document.documentElement.className = mood;
  if (mood !== lastMood) {
    lastMood = mood;
    if (game.started) audio.mood(mood === "mood-night" ? "night" : "mall");
  }
  const clockNode = document.getElementById("clock");
  if (clockNode) clockNode.textContent = E.formatClock(game.t);
  paintChrome(route);
  paintDock(route);
  viewEl.replaceChildren(viewFor(route));
  const key = route.name + "/" + route.id + "/" + (route.q.q || "");
  if (key !== lastRouteKey) {
    lastRouteKey = key;
    window.scrollTo(0, 0);
  }
  if (route.name === "chat") {
    chatOpen = false;
    sBadge = false;
  }
  paintChat();
  if (route.name === "chase") beginChase();
  checkTimed();
  pumpS();
}

function viewFor(route) {
  if (!game.started && route.name !== "endings" && route.name !== "settings" && route.name !== "vault") return splashView();
  switch (route.name) {
    case "home":
      return homeView();
    case "list":
      return listView(route.q.cat || "all");
    case "item":
      return itemView(route.id);
    case "cart":
      return cartView();
    case "order":
      return orderView();
    case "done":
      return doneView();
    case "search":
      return searchView(route.q.q || "");
    case "police":
      return policeView();
    case "match":
      return matchView();
    case "chat":
      return chatPageView();
    case "chase":
      return chaseView();
    case "door":
      return doorView();
    case "clues":
      return cluesView();
    case "endings":
      return endingsView();
    case "ending":
      return endingView(route.id);
    case "vault":
      return vaultView();
    case "settings":
      return settingsView();
    case "about":
      return aboutView();
    case "mail":
      return route.id ? mailView(route.id) : mailListView();
    default:
      return notFoundView();
  }
}

function itemView(id) {
  const p = pById(id);
  if (!p) return notFoundView();
  if (!game.seen["item:" + id]) {
    game.seen["item:" + id] = true;
    E.advance(game, p.creepy ? 2 : 1);
    if (p.creepy) {
      if (!game.seen.creepy) game.seen.creepy = true;
      if (id === "bat") game.seen.itemBat = true;
    }
    save();
  }
  if (p.clueOnOpen) grant(p.clueOnOpen);

  const wrap = h("div", { class: "page pdp" });
  wrap.appendChild(h("div", { class: "crumbs" },
    h("a", { class: "crumbs__back", href: nightBack() }, icon("back")),

  wrap.appendChild(h("h1", { class: "pdp__name", text: p.name }));

  wrap.appendChild(h("div", { class: "pdp__rate" }, stars(p.rating), h("span", { class: "pdp__count", text: "리뷰 " + p.reviews + " · 후기 평점 " + p.rating.toFixed(1) })));

function doSearch(raw) {
  const q = String(raw || "").trim();
  if (!q) {
    go("#/search");
    return;
  }
  E.visit(game, "q:" + q, 1);
  save();
  audio.type();
  go("#/search?q=" + encodeURIComponent(q));
}

function resultsFor(q) {
  const n = q.replace(/\s+/g, " ");
  const out = [];
  if (game.ordered) {
    for (let i = 0; i < SEARCH_SPECIAL.length; i += 1) {
      const r = SEARCH_SPECIAL[i];
      for (let j = 0; j < r.keys.length; j += 1) {
        if (n.indexOf(r.keys[j]) !== -1) {
          out.push(r);
          break;
        }
      }
    }
  }
  for (let i = 0; i < SEARCH_BASE.length; i += 1) out.push(SEARCH_BASE[i]);

}

function checkMatches() {
  let right = 0;
  let wrong = 0;
  for (let i = 0; i < MATCH_SLOTS.length; i += 1) {
    const slot = MATCH_SLOTS[i];
    if (game.matches[slot.id]) continue;
    const pick = matchDraft[slot.id];
    if (!pick) continue;
    if (E.matchSlot(game, slot.id, pick)) right += 1;
    else wrong += 1;
  }
  save();
  if (right) {
    audio.beep();
    toast(right + "건 일치. 수첩에 기록했습니다.");
  }
  if (wrong) {
    audio.error();
    shake();
    flash();
    toast(wrong + "건이 맞지 않습니다. 사건 기록을 다시 읽어 보세요.");
  }
  if (!right && !wrong) {
    toast("상품을 먼저 고르세요.");
    audio.error();
  }
  if (E.allMatched(game)) {
    audio.stinger();
    chatThread = "s";
    toast("증거 4건이 모두 일치합니다. 경찰에 제보할 수 있습니다.");
  }
  render();
}

function beginChase() {
  if (!game.chase) E.startChase(game);
  if (chatOpen) {
    chatOpen = false;
    paintChat();
  }
  if (chaseTimer) return;
  audio.mood("chase");
  audio.startHeart(72);
  audio.startStatic(0.018);
  chaseTimer = window.setInterval(function () {
    if (!game.chase || game.ended) {
      stopChase();
      return;
    }
    const c = E.chaseTick(game);
    save();
    if (c.opened) {
      stopChase();
      audio.stinger();
      endGame("taken");
      return;
    }
    audio.knock(c.step > 2 ? 3 : 2);
    if (c.step >= 2) audio.rattle();
    if (c.step === 2) audio.whisper();
    if (c.step === 3) audio.lockError();
    audio.steps(c.step > 1 ? 3 : 2, 0.03 + c.step * 0.02, c.step / 4);
    audio.setHeart(72 + c.step * 14);
    shake();
    flash();
    if (c.step >= 4) {
      stopChase();
      const id = E.resolveEnding(game);
      endGame(id);
      return;
    }
    if (parseHash().name === "chase") render();
    else toast("현관 쪽에서 소리가 납니다. " + c.dist + "m.");
  }, 7000);
}

function mailListView() {
  const wrap = h("div", { class: "page" });
  wrap.appendChild(h("div", { class: "pagehead" },
    h("p", { class: "kicker", text: "메일함" }),
    h("h1", { class: "pagehead__title", text: "받은 메일 " + MAILS.length })
  ));
  const list = h("div", { class: "maillist" });
  for (let i = 0; i < MAILS.length; i += 1) {
    const m = MAILS[i];
    const row = h("a", { class: "mailrow" + (game.read[m.id] ? "" : " is-new"), href: "#/mail/" + m.id });
    const main = h("div", { class: "mailrow__main" });
    main.appendChild(h("span", { class: "mailrow__from", text: m.from }));
    main.appendChild(h("span", { class: "mailrow__subject", text: m.subject }));
    main.appendChild(h("span", { class: "mailrow__preview", text: m.body[0] }));
    row.appendChild(main);
    row.appendChild(h("span", { class: "mailrow__date", text: m.date }));
    list.appendChild(row);
  }
  wrap.appendChild(list);
  wrap.appendChild(h("p", { class: "fineprint", text: "모르는 발신자의 메일은 열지 않는 것이 좋습니다. 다만, 열어야 알 수 있는 것도 있습니다." }));
  return wrap;
}

function mailView(id) {
  const m = mailById(id);
  if (!m) return notFoundView();
  if (!game.read[id]) {
    game.read[id] = true;
    save();
  }
  if (m.clue) grant(m.clue);
  const wrap = h("div", { class: "page" });
  wrap.appendChild(h("div", { class: "crumbs" },
    h("a", { class: "crumbs__back", href: "#/mail" }, icon("back")),
    h("span", { class: "crumbs__text", text: "메일" })
  ));
  const card = h("article", { class: "mail" });
  card.appendChild(h("p", { class: "mail__from", text: m.from + " <" + m.address + ">" }));
  card.appendChild(h("h1", { class: "mail__subject", text: m.subject }));
  card.appendChild(h("p", { class: "mail__date", text: m.date + " · 받는 사람 " + SHOP.customerName }));
  const body = h("div", { class: "mail__body" });
  for (let i = 0; i < m.body.length; i += 1) {
    if (m.body[i] === "") body.appendChild(h("div", { class: "mail__gap" }));
    else body.appendChild(h("p", { class: "mail__p", text: m.body[i] }));
  }
  card.appendChild(body);
  wrap.appendChild(card);
  if (id === "winter" && E.hasClue(game, "lullaby") && !game.sentLullaby) {
    wrap.appendChild(h("button", {
      class: "btn btn--danger btn--block",
      type: "button",
      text: "자장가로 답장하기",
      on: {
        click: function () {
          E.sendLullaby(game);
          save();
          audio.lullaby();
          toast("답장을 보냈습니다. 세 시 반에 돌아온다고 적었습니다.");
          render();
        },
      },
    }));
  }
  wrap.appendChild(h("a", { class: "btn btn--ghost btn--block", href: "#/mail", text: "메일함으로" }));
  return wrap;
}

  go("#/ending/" + game.ended);
} else if (game.started && game.phase === "chase") {

  beginChase();
}
